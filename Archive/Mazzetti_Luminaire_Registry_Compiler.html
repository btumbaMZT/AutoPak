        '<div class="card-meta">'+esc([p.client,p.location].filter(Boolean).join(' · ')||'—')+'<br>'+i.length+' issuance'+(i.length===1?'':'s')+(i[0]?' · last '+fmt(i[0].date):'')+'</div>'+
        '<div class="card-foot">'+(p.phase?'<span class="tag tag-sand">'+esc(p.phase)+'</span>':'')+(t.length?'<span class="tag tag-sky">'+t.length+' types</span>':'')+
        '<span class="spacer"></span><button class="row-btn" data-compile="'+p.id+'">Compile</button></div></div>';}).join('')
      :'<p class="t-dim" style="font-family:var(--mono);font-size:11px;padding:4px 2px">Empty</p>')+'</div>';
  }).join('')+'</div>';
}
function timelineView(){
  const ids=new Set(visible().filter(p=>p.onTimeline!==false).map(p=>p.id));
  const rows=reg.issuances.filter(i=>ids.has(i.projectId)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  if(!rows.length)return emptyState('Nothing on the timeline yet','Issuances appear here the moment a package is compiled or logged.');
  let out='',year='';
  rows.forEach(i=>{const p=projOf(i.projectId), y=String(i.date||'').slice(0,4)||'—';
    if(y!==year){year=y;out+='<div class="tl-year"><span>'+esc(y)+'</span><hr></div>';}
    out+='<div class="tl-item" data-open="'+i.projectId+'"><div class="tl-date">'+fmt(i.date)+'</div><div>'+
      '<div class="tl-title">'+esc(p?p.name:'Unassigned')+' — '+esc(i.issuedFor||i.packageType||'Package')+'</div>'+
      '<div class="tl-sub">'+[i.fileName,i.pageCount?i.pageCount+' pp':'',(i.fixtureTags||[]).length?(i.fixtureTags||[]).length+' types':'',i.notes].filter(Boolean).map(esc).join(' · ')+'</div></div></div>';});
  return out;
}
function issuanceView(){
  let rows=reg.issuances.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  if(q){const s=q.toLowerCase();rows=rows.filter(i=>{const p=projOf(i.projectId);return [i.issuedFor,i.packageType,i.fileName,i.notes,i.transmittedTo,i.revision,p&&p.name,p&&p.abbreviation].concat(i.fixtureTags||[]).join(' ').toLowerCase().includes(s);});}
  if(!rows.length)return emptyState('No issuances logged','Compile a package from a project and it lands here automatically.');
  return '<table class="tbl"><thead><tr><th>Date</th><th>Project</th><th>Issued for</th><th>Package</th><th>File</th><th>Pages</th><th>Types</th><th>Source</th></tr></thead><tbody>'+
    rows.map(i=>{const p=projOf(i.projectId);return '<tr data-open="'+i.projectId+'">'+
    '<td class="t-abbr">'+fmt(i.date)+'</td>'+
    '<td><div class="t-name">'+esc(p?p.name:'Unassigned')+'</div>'+(p&&p.abbreviation?'<div class="t-dim">'+esc(p.abbreviation)+'</div>':'')+'</td>'+
    '<td>'+(i.issuedFor?'<span class="tag tag-sand">'+esc(i.issuedFor)+'</span>':'<span class="t-dim">—</span>')+(i.revision?' <span class="tag">'+esc(i.revision)+'</span>':'')+'</td>'+
    '<td class="t-dim">'+esc(i.packageType||(i.hasSchedule?'Schedule & datasheets':'Datasheets only'))+'</td>'+
    '<td class="t-dim">'+esc(i.fileName||'—')+'</td><td class="t-dim">'+(i.pageCount||'—')+'</td>'+
    '<td class="t-dim">'+((i.fixtureTags||[]).length||'—')+'</td>'+
    '<td>'+(i.manual?'<span class="tag">logged</span>':'<span class="tag tag-sage">compiled</span>')+'</td></tr>';}).join('')+'</tbody></table>';
}
function typesView(){
  const map=new Map();
  reg.issuances.forEach(i=>(i.fixtureTags||[]).forEach(t=>{if(!t)return;
    const e=map.get(t)||{projects:new Set(),last:'',count:0};
    e.projects.add(i.projectId);e.count++;if(String(i.date||'')>e.last)e.last=i.date||'';map.set(t,e);}));
  let rows=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));
  if(q)rows=rows.filter(([t])=>t.toLowerCase().includes(q.toLowerCase()));
  const c=$('tc');if(c)c.textContent=rows.length+' types';
  if(!rows.length)return emptyState('No luminaire types yet','Types come from the tags stamped on each compiled package.');
  return '<table class="tbl"><thead><tr><th>Type</th><th>Projects</th><th>Issuances</th><th>Last used</th><th>Appears on</th></tr></thead><tbody>'+
    rows.map(([t,e])=>'<tr><td class="t-abbr">'+esc(t)+'</td><td class="t-dim">'+e.projects.size+'</td><td class="t-dim">'+e.count+'</td><td class="t-dim">'+fmt(e.last)+'</td>'+
    '<td><div class="tags">'+[...e.projects].map(id=>{const p=projOf(id);return '<span class="tag">'+esc(p?(p.abbreviation||p.name):'—')+'</span>';}).join('')+'</div></td></tr>').join('')+'</tbody></table>';
}
function dataView(){
  return '<div class="det-meta">'+
    '<div><div class="det-k">Storage</div><div class="det-v">'+(STORE==='cloud'?'Shared registry':STORE==='local'?'This browser only':'This tab only')+'</div></div>'+
    '<div><div class="det-k">Record key</div><div class="det-v" style="font-family:var(--mono);font-size:11.5px">'+KEY+'</div></div>'+
    '<div><div class="det-k">Last write</div><div class="det-v">'+(reg.updatedAt?fmt(reg.updatedAt):'—')+'</div></div>'+
    '<div><div class="det-k">Size</div><div class="det-v">'+(JSON.stringify(reg).length/1024).toFixed(1)+' KB</div></div></div>'+
    '<div class="det-sec"><h4>How this works</h4><p>Compiling a package never uploads anything. The PDFs are read, stamped and merged in your browser, and only the resulting record — date, phase, filename, page count and luminaire types — is written to the shared registry. The source PDFs stay on your machine.</p></div>'+
    (STORE==='cloud'?'':STORE==='local'
      ?'<div class="det-sec"><h4>Running from disk</h4><p>Shared storage isn’t reachable when this file is opened directly, so records are kept in this browser’s localStorage. They survive closing the tab and the browser, but they live on this machine only — teammates won’t see them, and clearing site data wipes them. Use the .json export to hand the registry to someone else, or open the tool inside Claude for the shared registry.</p></div>'
      :'<div class="det-sec"><h4>Storage unavailable</h4><p>Neither shared storage nor localStorage is reachable here, so records live in this tab only. Export a .json backup before you close it.</p></div>')+
    '<div class="det-sec"><h4>Backups</h4><p>The JSON export carries the whole registry and imports back by merge or replace. The CSV is a flat issuance log for spreadsheets and reporting.</p></div>';
}

/* ═══════════ Export ═══════════ */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(a.href),100);}
function exportJson(){dl(new Blob([JSON.stringify(reg,null,2)],{type:'application/json'}),'Mazzetti_Luminaire_Registry_'+new Date().toISOString().slice(0,10)+'.json');toast('Exported '+reg.projects.length+' projects');}
function exportCsv(){
  const Q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const head=['Date','Project','Abbreviation','Client','Location','Sector','Issued for','Issuance description','Revision','Package','File name','Pages','Datasheets','Luminaire types','Transmitted to','Source','Notes'];
  const rows=reg.issuances.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))).map(i=>{const p=projOf(i.projectId)||{};
    return [i.date,p.name,p.abbreviation,p.client,p.location,p.sector,i.issuedFor,i.issuanceDescription,i.revision,i.packageType,i.fileName,i.pageCount,i.datasheetCount,(i.fixtureTags||[]).join(' | '),i.transmittedTo,i.manual?'logged':'compiled',i.notes].map(Q).join(',');});
  dl(new Blob([head.map(Q).join(',')+'\n'+rows.join('\n')],{type:'text/csv'}),'Mazzetti_Issuance_Log_'+new Date().toISOString().slice(0,10)+'.csv');
  toast('Exported '+rows.length+' issuances');
}
function importJson(file){
  const r=new FileReader();
  r.onload=async()=>{
    let d;try{d=JSON.parse(r.result);}catch(e){return toast('That file isn’t valid registry JSON');}
    if(!d||!Array.isArray(d.projects))return toast('That file isn’t a registry export');
    const merge=confirm('Merge into the current registry?\n\nOK = merge (keeps existing records)\nCancel = replace everything');
    if(merge){const hp=new Set(reg.projects.map(p=>p.id));d.projects.forEach(p=>{if(!hp.has(p.id))reg.projects.push(p);});
      const hi=new Set(reg.issuances.map(i=>i.id));(d.issuances||[]).forEach(i=>{if(!hi.has(i.id))reg.issuances.push(i);});}
    else reg={version:1,projects:d.projects,issuances:d.issuances||[]};
    await save(); render(true); toast('Imported '+d.projects.length+' projects');
  };
  r.readAsText(file);
}

/* ═══════════ Chrome ═══════════ */
const TITLES={
  projects:['Luminaire package registry','Mazzetti — project record & issuance history'],
  issuances:['Issuance log','Every package the studio has sent out, newest first'],
  types:['Luminaire type library','Which types have been specified, and where'],
  data:['Data & storage','Where the registry lives, and how to back it up'],
  compile:['Compile a package','Stamped, merged and logged against the project record']
};
function renderRail(){
  const t=new Set();reg.issuances.forEach(i=>(i.fixtureTags||[]).forEach(x=>x&&t.add(x)));
  $('sProjects').textContent=reg.projects.length;
  $('sIssuances').textContent=reg.issuances.length;
  $('sTypes').textContent=t.size;
  const l=reg.issuances.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];
  $('sLast').textContent=l?fmtShort(l.date):'—';
  $('storeMeta').textContent=STORE==='cloud'?'BACKED BY SHARED STORAGE · REGISTRY.JSON'
    :STORE==='local'?'THIS BROWSER ONLY · LOCALSTORAGE':'LOCAL SESSION · NOT PERSISTED';
}
let lastToolbarSection=null;
function renderToolbar(){
  const t=$('toolbar');
  if(!RM&&lastToolbarSection!==section){
    t.classList.remove('swap'); void t.offsetWidth; t.classList.add('swap');
    clearTimeout(t._s); t._s=setTimeout(()=>t.classList.remove('swap'),420);
  }
  lastToolbarSection=section;
  const sync='<span class="pill-sync'+(storeOk?'':' warn')+'"><i></i>'+(storeOk?'Synced':'Session only')+'</span>';
  if(section==='projects'){
    t.innerHTML='<div class="seg">'+['board','table','timeline'].map(v=>'<button data-v="'+v+'" aria-pressed="'+(view===v)+'">'+v+'</button>').join('')+'</div>'+
      '<select id="fs"><option value="all">All statuses</option>'+opts(STATUSES,fStatus==='all'?null:fStatus)+'</select>'+
      '<select id="fx"><option value="all">All sectors</option>'+opts(SECTORS,fSector==='all'?null:fSector)+'</select>'+
      '<select id="fp"><option value="all">All phases</option>'+opts(PHASES,fPhase==='all'?null:fPhase)+'</select>'+
      '<input type="search" id="q" placeholder="Search projects, clients, luminaire types…" value="'+esc(q)+'">'+
      '<span class="pill-count">'+visible().length+' of '+reg.projects.length+' projects</span>'+sync+
      '<button class="btn" id="add">+ Project</button><button class="btn btn-dark" id="cmp">+ Package</button>';
    t.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
      if(view===b.dataset.v)return;
      view=b.dataset.v;
      t.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));
      refreshList(true);
    });
    $('fs').onchange=e=>{fStatus=e.target.value;refreshList(true);};
    $('fx').onchange=e=>{fSector=e.target.value;refreshList(true);};
    $('fp').onchange=e=>{fPhase=e.target.value;refreshList(true);};
    $('add').onclick=()=>addProject();
    $('cmp').onclick=pickProjectThenCompile;
    $('q').oninput=e=>{q=e.target.value;refreshList(false);};
  }else if(section==='issuances'){
    t.innerHTML='<input type="search" id="q" placeholder="Search issuances, files, phases…" value="'+esc(q)+'">'+
      '<span class="pill-count">'+reg.issuances.length+' issuances</span>'+sync+
      '<button class="btn" id="man">+ Log past issuance</button><button class="btn btn-dark" id="cmp">+ Package</button>';
    $('man').onclick=()=>reg.projects.length?logIssuance(null):toast('Add a project first');
    $('cmp').onclick=pickProjectThenCompile;
    $('q').oninput=e=>{q=e.target.value;renderView(false);};
  }else if(section==='types'){
    t.innerHTML='<input type="search" id="q" placeholder="Search luminaire types…" value="'+esc(q)+'"><span class="pill-count" id="tc"></span>'+sync;
    $('q').oninput=e=>{q=e.target.value;renderView(false);};
  }else if(section==='compile'){
    const p=projOf(compileFor);
    t.innerHTML='<span class="pill-count">'+esc(p?(p.abbreviation?p.abbreviation+' · ':'')+p.name:'No project')+'</span>'+sync+
      '<span class="spacer"></span><button class="btn btn-sm" id="swap">Switch project</button>';
    $('swap').onclick=pickProjectThenCompile;
  }else{
    t.innerHTML=sync+'<span class="spacer"></span><button class="btn mono-btn" id="exp">↓ .json</button>'+
      '<button class="btn mono-btn" id="csv">↓ .csv</button><button class="btn mono-btn" id="imp">↑ import</button>'+
      '<input type="file" id="impf" accept=".json,application/json" style="display:none">';
    $('exp').onclick=exportJson;$('csv').onclick=exportCsv;
    $('imp').onclick=()=>$('impf').click();
    $('impf').onchange=e=>{if(e.target.files[0])importJson(e.target.files[0]);e.target.value='';};
  }
}
function viewHtml(){
  return section==='projects' ? (view==='table'?tableView():view==='board'?boardView():timelineView())
    : section==='issuances' ? issuanceView()
    : section==='types' ? typesView() : dataView();
}
function bindView(){
  const host=$('view');
  host.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-compile]'))return;detail(el.dataset.open);});
  host.querySelectorAll('[data-compile]').forEach(b=>b.onclick=e=>{e.stopPropagation();openCompiler(b.dataset.compile);});
  const ea=host.querySelector('#emptyAdd'); if(ea)ea.onclick=()=>addProject();
}
let paintToken=0;
function paintView(animate){
  const host=$('view'), token=++paintToken;
  const put=()=>{
    if(token!==paintToken)return;
    host.innerHTML=viewHtml(); bindView();
    host.classList.remove('leaving');
    host.classList.toggle('stagger',!!animate&&!RM);
    if(!animate||RM)return;
    host.classList.add('entering');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(token===paintToken)host.classList.remove('entering'); }));
  };
  if(!animate||RM){host.classList.remove('leaving','entering');put();return;}
  host.classList.add('leaving');
  setTimeout(put,D(160));
}
function renderView(animate){
  if(section==='compile'){ if(!compileMounted||!$('compileRoot'))mountCompile(); return; }
  compileMounted=false;
  paintView(animate);
}
function refreshList(animate){
  renderView(animate);
  const c=$('toolbar').querySelector('.pill-count');
  if(c&&section==='projects')c.textContent=visible().length+' of '+reg.projects.length+' projects';
}
function setHead(a,b){
  const t=$('secTitle'), s=$('secSub');
  if(t.textContent===a&&s.textContent===b)return;
  if(RM){t.textContent=a;s.textContent=b;return;}
  t.classList.add('head-out'); s.classList.add('head-out');
  setTimeout(()=>{
    t.textContent=a; s.textContent=b;
    requestAnimationFrame(()=>{t.classList.remove('head-out');s.classList.remove('head-out');});
  },160);
}
function render(animate){
  const t=TITLES[section];
  setHead(t[0],t[1]);
  renderRail(); renderToolbar(); renderView(animate);
}

$('nav').querySelectorAll('button[data-sec]').forEach(b=>b.onclick=()=>{
  section=b.dataset.sec;q='';compileMounted=false;
  $('nav').querySelectorAll('button[data-sec]').forEach(x=>x.setAttribute('aria-current',x===b));
  render(true);
});
$('newPkg').onclick=pickProjectThenCompile;

load().then(()=>render(true));
})();
</script>
