<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mazzetti — Luminaire Registry &amp; Package Compiler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --brand:#006595;--brand-deep:#00506f;--ink:#141719;--paper:#fff;--field:#fafaf8;--line:#e6e4df;
  --line-strong:#cfccc5;--muted:#7a7770;
  --sand:#f2e6d8;--sand-line:#e0cdb6;--sand-ink:#8a6338;
  --sage:#e4ebe5;--sage-line:#c6d6c9;--sage-ink:#3f6349;
  --sky:#e2ecf2;--sky-line:#bcd4e0;--sky-ink:#0d5678;
  --red:#b2432a;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

/* Rail */
.rail{border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto}
.mark{display:flex;align-items:baseline;gap:8px;padding:0 6px}
.mark-m{font-weight:800;font-size:34px;letter-spacing:-.04em;line-height:.9}
.mark-word{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0 10px 8px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;font:inherit;font-size:13.5px;color:var(--ink);padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .28s cubic-bezier(.4,0,.2,1),color .28s cubic-bezier(.4,0,.2,1),transform .16s ease}
.nav button:active{transform:translateX(2px)}
.dot{transition:background .28s ease}
.nav button:hover{background:var(--field)}
.nav button[aria-current="true"]{background:var(--ink);color:#fff}
.nav button[aria-current="true"] .dot{background:#fff}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong);flex-shrink:0}
.nav .make{margin-top:8px;border:1px dashed var(--line-strong);justify-content:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav .make:hover{border-color:var(--ink);background:var(--field)}
.rail-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:7px}
.rail-stat{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.rail-stat b{color:var(--ink);font-weight:600}

/* Head */
main{min-width:0;padding:30px clamp(18px,3.5vw,44px) 70px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:22px;flex-wrap:wrap}
h1{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sheet-sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:5px}
.sheet-meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--line-strong);text-align:right;line-height:1.9}
.sheet-meta b{color:var(--muted);font-weight:500}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:18px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{background:none;border:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:8px 13px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line);transition:background .3s cubic-bezier(.4,0,.2,1),color .3s cubic-bezier(.4,0,.2,1)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--field);color:var(--ink);font-weight:600}
select,input[type=search],input[type=text],input[type=number],input[type=date],textarea{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,101,149,.13)}
.toolbar input[type=search]{flex:1;min-width:180px;background:var(--field)}
.spacer{flex:1}
.pill-count{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 12px;white-space:nowrap}
.pill-sync{font-family:var(--mono);font-size:11px;border-radius:99px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--sage-line);background:var(--sage);color:var(--sage-ink)}
.pill-sync.warn{border-color:var(--sand-line);background:var(--sand);color:var(--sand-ink)}
.pill-sync i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.btn{font-family:var(--sans);font-size:13px;font-weight:600;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);white-space:nowrap;transition:background .26s cubic-bezier(.4,0,.2,1),border-color .26s cubic-bezier(.4,0,.2,1),color .26s cubic-bezier(.4,0,.2,1),box-shadow .26s ease,transform .14s ease,opacity .26s ease}
.btn:active:not(:disabled){transform:translateY(1px) scale(.985)}
.btn-dark:hover{box-shadow:0 4px 14px rgba(20,23,25,.22)}
.btn:hover{background:var(--field)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-ghost{border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);background:var(--field)}
.btn-danger{color:var(--red)}
.btn-danger:hover{background:#fdf1ee;border-color:var(--red)}
.btn-sm{font-size:12px;padding:6px 11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,.nav button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em}

/* Table */
.tbl{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tbl thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--ink);text-align:left;padding:10px 12px;font-weight:500;white-space:nowrap}
.tbl td{border-top:1px solid var(--line);padding:11px 12px;vertical-align:top;font-size:13.5px}
.tbl tbody tr{cursor:pointer;transition:background .24s cubic-bezier(.4,0,.2,1)}
.tbl tbody tr:hover{background:var(--field)}
.t-abbr{font-family:var(--mono);font-size:12px;font-weight:600}
.t-name{font-weight:600}
.t-dim{color:var(--muted);font-size:12.5px}
.star{color:var(--sand-ink)}
.row-btn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-strong);background:var(--paper);border-radius:99px;padding:4px 9px;cursor:pointer;color:var(--muted);transition:border-color .26s ease,color .26s ease,background .26s ease,transform .14s ease}
.row-btn:active{transform:scale(.94)}
.row-btn:hover{border-color:var(--ink);color:var(--ink)}

.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:3px 8px;border-radius:99px;white-space:nowrap;border:1px solid var(--line-strong);color:var(--muted);background:var(--paper)}
.tag-sand{background:var(--sand);border-color:var(--sand-line);color:var(--sand-ink)}
.tag-sage{background:var(--sage);border-color:var(--sage-line);color:var(--sage-ink)}
.tag-sky{background:var(--sky);border-color:var(--sky-line);color:var(--sky-ink)}
.tag-ink{background:var(--ink);border-color:var(--ink);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:4px}

/* Board / timeline */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
.col-head{display:flex;align-items:center;gap:8px;padding:0 2px 10px;border-bottom:1px solid var(--ink);margin-bottom:12px}
.col-title{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.col-count{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.card{border:1px solid var(--line);border-radius:8px;padding:13px;cursor:pointer;margin-bottom:10px;transition:border-color .28s cubic-bezier(.4,0,.2,1),box-shadow .28s cubic-bezier(.4,0,.2,1),transform .22s cubic-bezier(.4,0,.2,1)}
.card:hover{border-color:var(--ink);box-shadow:0 6px 18px rgba(20,23,25,.08);transform:translateY(-2px)}
.card:active{transform:translateY(0)}
.card-top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.card-name{font-weight:600;font-size:14px;line-height:1.3;margin-bottom:4px}
.card-meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.7}
.card-foot{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}
.tl-year{display:flex;align-items:center;gap:12px;margin:22px 0 12px}
.tl-year span{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--muted)}
.tl-year hr{flex:1;border:none;border-top:1px solid var(--line)}
.tl-item{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tl-item:hover{background:var(--field)}
.tl-date{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:2px}
.tl-title{font-weight:600;font-size:14px}
.tl-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}

.empty{border:1px dashed var(--line-strong);border-radius:8px;padding:42px 24px;text-align:center;background:var(--field)}
.empty h3{font-size:16px;font-weight:700;margin-bottom:6px}
.empty p{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.empty .btn{margin-top:16px}

/* Modal */
.veil{position:fixed;inset:0;background:rgba(20,23,25,.42);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto;z-index:40;animation:veilIn .3s cubic-bezier(.4,0,.2,1) both}
.sheet{background:var(--paper);border-radius:10px;width:100%;max-width:600px;box-shadow:0 24px 60px rgba(0,0,0,.22);animation:sheetIn .34s cubic-bezier(.22,.61,.36,1) both}
.sheet.wide{max-width:720px}
.veil.noanim,.veil.noanim .sheet{animation:none}
.veil.out{animation:veilOut .24s cubic-bezier(.4,0,1,1) both}
.veil.out .sheet{animation:sheetOut .24s cubic-bezier(.4,0,1,1) both}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
@keyframes veilOut{from{opacity:1}to{opacity:0}}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheetOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(10px) scale(.99)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheet-hd{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 0}
.sheet-hd h2{font-size:19px;font-weight:700}
.sheet-hd p{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.x{background:none;border:none;font-size:19px;line-height:1;color:var(--muted);cursor:pointer;margin-left:auto;padding:2px 4px}
.x:hover{color:var(--ink)}
.sheet-bd{padding:18px 22px}
.sheet-ft{display:flex;gap:9px;justify-content:flex-end;padding:6px 22px 22px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.f label b{color:var(--red);font-weight:400}
.f input,.f select,.f textarea{width:100%;background:var(--field)}
.f textarea{resize:vertical;min-height:72px;font-family:var(--sans);line-height:1.5}
.f .hint{font-family:var(--mono);font-size:10px;color:var(--muted)}
.check{display:flex;align-items:center;gap:9px;font-size:13px;margin-top:2px;cursor:pointer}
.check input{accent-color:var(--ink);width:15px;height:15px}
details.more{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
details.more summary{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
details.more summary::before{content:'▶ ';font-size:8px}
details.more[open] summary::before{content:'▼ '}
details.more .grid{margin-top:14px}

.det-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:16px}
.det-k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.det-v{font-size:13.5px;margin-top:3px}
.det-v.dim{color:var(--muted);font-style:italic}
.det-sec{margin-bottom:16px}
.det-sec h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.det-sec p{font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.iss-row{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin-bottom:6px}
.iss-d{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:80px;padding-top:2px}
.iss-b{flex:1;min-width:0}
.iss-t{font-size:13.5px;font-weight:600}
.iss-s{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.iss-n{font-size:12.5px;color:var(--muted);margin-top:3px}

/* ── Compiler workspace ── */
.ctx{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:8px;padding:12px 15px;margin-bottom:16px;flex-wrap:wrap}
.ctx-name{font-weight:700;font-size:15px}
.ctx-meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.panels .wide{grid-column:1/-1}
.pnl{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pnl-hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--field)}
.pnl-n{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:#fff;background:var(--ink);padding:3px 7px;border-radius:4px}
.pnl-t{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.pnl-opt{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-left:auto}
.pnl-bd{padding:14px}
.pnl-note{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.7;margin-bottom:11px}

.dz{border:1px dashed var(--line-strong);border-radius:6px;padding:20px 14px;text-align:center;cursor:pointer;background:var(--field);transition:border-color .3s cubic-bezier(.4,0,.2,1),background .3s cubic-bezier(.4,0,.2,1),transform .2s ease}
.dz:hover,.dz.on{border-color:var(--ink);background:#fff}
.dz.on{transform:scale(1.012)}
.dz input{display:none}
.dz label{cursor:pointer;display:block}
.dz-cta{font-weight:600;font-size:13.5px}
.dz-hint{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;display:block}

.fl{display:flex;flex-direction:column;gap:5px;margin-top:11px}
.fi{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--paper);transition:border-color .24s ease}
.fi:hover{border-color:var(--line-strong)}
.fi.in{animation:fiIn .34s cubic-bezier(.22,.61,.36,1) both}
.fi.out{animation:fiOut .26s cubic-bezier(.4,0,1,1) both}
@keyframes fiIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes fiOut{from{opacity:1}to{opacity:0;transform:translateX(14px)}}
.grip{cursor:grab;color:var(--line-strong);font-size:12px;flex-shrink:0}
.grip:hover{color:var(--ink)}
.fn{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 3px}
.fx:hover{color:var(--red)}
.ghost{opacity:.35;background:var(--field)}

/* Linked-folder bar */
.folderbar{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:6px;padding:9px 11px;margin-bottom:11px;background:var(--field)}
.fb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb-t{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fb-path{font-family:var(--mono);font-size:10.5px;color:var(--ink);word-break:break-all;margin-top:5px;line-height:1.55}
.fb-note{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;line-height:1.6}
.fb-note.warn{color:var(--sand-ink)}
.fb-note.err{color:var(--red)}
.fb-note.ok{color:var(--sage-ink)}

.delta{display:flex;flex-direction:column;gap:9px}
.delta-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.delta-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-width:92px;padding-top:4px}

.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px;opacity:0;transform:scaleX(.985);transform-origin:left;transition:opacity .35s cubic-bezier(.4,0,.2,1),transform .35s cubic-bezier(.4,0,.2,1)}
.track.on{opacity:1;transform:none}
.fill{height:100%;width:0;background:var(--ink);transition:width .45s cubic-bezier(.22,.61,.36,1)}
.stat-line{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:9px;min-height:16px}
.stat-line.ok{color:var(--sage-ink)}
.stat-line.err{color:var(--red)}
.act{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}
@keyframes sp{to{transform:rotate(360deg)}}
.sp{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}

.toast{position:fixed;left:50%;bottom:24px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:11.5px;padding:11px 18px;border-radius:6px;z-index:60;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(20,23,25,.28);animation:toastIn .36s cubic-bezier(.22,.61,.36,1) both}
.toast.out{animation:toastOut .3s cubic-bezier(.4,0,1,1) both}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(12px)}}

/* ── Motion ── */
#view{transition:opacity .26s cubic-bezier(.4,0,.2,1),transform .26s cubic-bezier(.4,0,.2,1)}
#view.leaving{opacity:0;transform:translateY(-7px)}
#view.entering{opacity:0;transform:translateY(11px);transition:none}

@keyframes rowIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#view.stagger .empty,
#view.stagger tbody tr,
#view.stagger .card,
#view.stagger .tl-item,
#view.stagger .tl-year,
#view.stagger .board>div,
#view.stagger .det-meta,
#view.stagger .det-sec{animation:rowIn .44s cubic-bezier(.22,.61,.36,1) both}
#view.stagger tbody tr:nth-child(1),#view.stagger .card:nth-child(1),#view.stagger .tl-item:nth-child(1),#view.stagger .board>div:nth-child(1),#view.stagger .det-sec:nth-child(1){animation-delay:.03s}
#view.stagger tbody tr:nth-child(2),#view.stagger .card:nth-child(2),#view.stagger .tl-item:nth-child(2),#view.stagger .board>div:nth-child(2),#view.stagger .det-sec:nth-child(2){animation-delay:.06s}
#view.stagger tbody tr:nth-child(3),#view.stagger .card:nth-child(3),#view.stagger .tl-item:nth-child(3),#view.stagger .board>div:nth-child(3),#view.stagger .det-sec:nth-child(3){animation-delay:.09s}
#view.stagger tbody tr:nth-child(4),#view.stagger .card:nth-child(4),#view.stagger .tl-item:nth-child(4),#view.stagger .board>div:nth-child(4),#view.stagger .det-sec:nth-child(4){animation-delay:.12s}
#view.stagger tbody tr:nth-child(5),#view.stagger .card:nth-child(5),#view.stagger .tl-item:nth-child(5),#view.stagger .det-sec:nth-child(5){animation-delay:.15s}

<body>
<div class="app">
  <aside class="rail">
    <div class="mark"><span class="mark-m">M</span><span class="mark-word">Lighting<br>Design Studio</span></div>
    <nav class="nav" id="nav">
      <div class="nav-label">Registry</div>
      <button data-sec="projects" aria-current="true"><span class="dot"></span>Projects</button>
      <button data-sec="issuances"><span class="dot"></span>Issuance log</button>
      <button data-sec="types"><span class="dot"></span>Luminaire types</button>
      <button data-sec="data"><span class="dot"></span>Data &amp; storage</button>
      <button class="make" id="newPkg">+ Compile package</button>
    </nav>
    <div class="rail-foot">
      <div class="rail-stat"><span>Projects</span><b id="sProjects">—</b></div>
      <div class="rail-stat"><span>Issuances</span><b id="sIssuances">—</b></div>
      <div class="rail-stat"><span>Types</span><b id="sTypes">—</b></div>
      <div class="rail-stat"><span>Last issued</span><b id="sLast">—</b></div>
    </div>
  </aside>

  <main>
    <header class="sheet-head">
      <div><h1 id="secTitle">Luminaire package registry</h1><p class="sheet-sub" id="secSub">Mazzetti — project record &amp; issuance history</p></div>
      <div class="sheet-meta">SHEET 01 OF 01 · REV A<br><b id="storeMeta">BACKED BY SHARED STORAGE · REGISTRY.JSON</b></div>
    </header>
    <div class="toolbar" id="toolbar"></div>
    <section id="view"></section>
  </main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>

<script>
(function(){
/* ═══════════ Storage ═══════════ */
const KEY='mazzetti:luminaire-registry:v1', SHARED=true;
const hasCloud=!!(window.storage&&typeof window.storage.get==='function');
// Fallback for when this file is opened straight from disk (file://), where
// window.storage doesn't exist. Records then persist per-machine in
// localStorage instead of evaporating with the tab.
const hasLocal=(function(){try{localStorage.setItem(KEY+':probe','1');localStorage.removeItem(KEY+':probe');return true;}catch(e){return false;}})();
const STORE=hasCloud?'cloud':hasLocal?'local':'none';
let reg={version:1,projects:[],issuances:[]}, storeOk=STORE!=='none';

const $=id=>document.getElementById(id);
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(r,id)=>r.querySelector('#'+id)?r.querySelector('#'+id).value.trim():'';
const chk=(r,id)=>!!(r.querySelector('#'+id)&&r.querySelector('#'+id).checked);
function fmt(iso){if(!iso)return '—';const d=new Date(String(iso).length<=10?iso+'T00:00:00':iso);return isNaN(d)?iso:d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});}
function fmtShort(iso){if(!iso)return '—';const d=new Date(String(iso).length<=10?iso+'T00:00:00':iso);return isNaN(d)?iso:d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}

function adopt(raw){ if(!raw)return; try{const p=JSON.parse(raw); if(p&&Array.isArray(p.projects))reg=p;}catch(e){} }
async function load(){
  if(STORE==='cloud'){
    try{const r=await window.storage.get(KEY,SHARED); if(r&&r.value)adopt(r.value); return;}catch(e){}
  }
  if(STORE==='local'){ try{adopt(localStorage.getItem(KEY));}catch(e){} return; }
  storeOk=false;
}
async function save(){ reg.updatedAt=new Date().toISOString();
  if(STORE==='cloud'){
    try{await window.storage.set(KEY,JSON.stringify(reg),SHARED);storeOk=true;return true;}
    catch(e){storeOk=false;toast('Save failed — export a backup before closing');renderRail();return false;}
  }
  if(STORE==='local'){
    try{localStorage.setItem(KEY,JSON.stringify(reg));storeOk=true;return true;}
    catch(e){storeOk=false;toast('Save failed (storage full?) — export a backup now');renderRail();return false;}
  }
  storeOk=false;renderRail();return false;
}

/* ═══════════ Model ═══════════ */
const issFor=id=>reg.issuances.filter(i=>i.projectId===id).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
function typesFor(id){const s=new Set();issFor(id).forEach(i=>(i.fixtureTags||[]).forEach(t=>t&&s.add(t)));return [...s].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));}
const projOf=id=>reg.projects.find(p=>p.id===id);
const STATUSES=['Active','On hold','Complete','Archived'];
const SECTORS=['Healthcare','Behavioral health','Lab / research','Education','Civic','Commercial','Residential','Other'];
const PHASES=['Concept','50% SD','100% SD','50% DD','100% DD','50% CD','100% CD','Permit','Bid','Addendum','Construction','Record set'];
/* One control now covers both "issued for" and the stamped issuance
   description. Each option carries a readable label (what gets stamped, and
   what lands in the filename) and the short phase code the registry filters,
   sorts and reports on. "Custom…" frees the description from the list; when
   it's used there's no recognised phase, so the project's phase is left alone. */
const ISSUANCES=[
  ['Concept','Concept'],
  ['50% Schematic Design','50% SD'],
  ['100% Schematic Design','100% SD'],
  ['50% Design Development','50% DD'],
  ['100% Design Development','100% DD'],
  ['50% Construction Documents','50% CD'],
  ['100% Construction Documents','100% CD'],
  ['Permit Set','Permit'],
  ['Bid Set','Bid'],
  ['Addendum','Addendum'],
  ['Construction Administration','Construction'],
  ['Record Set','Record set'],
];
const CUSTOM='__custom';
const phaseOfLabel=l=>{const r=ISSUANCES.find(x=>x[0]===l);return r?r[1]:'';};
const labelOfPhase=p=>{const r=ISSUANCES.find(x=>x[1]===p);return r?r[0]:'';};
function issuanceControl(sid,cid,phase,desc){
  const known=desc&&ISSUANCES.some(x=>x[0]===desc);
  const isCustom=!!desc&&!known;
  const chosen=known?desc:(desc?'':labelOfPhase(phase));
  return '<select id="'+sid+'"><option value="">—</option>'+
    ISSUANCES.map(x=>'<option'+(!isCustom&&x[0]===chosen?' selected':'')+'>'+esc(x[0])+'</option>').join('')+
    '<option value="'+CUSTOM+'"'+(isCustom?' selected':'')+'>Custom…</option></select>'+
    '<input type="text" id="'+cid+'" placeholder="Type the issuance description" value="'+
      esc(isCustom?desc:'')+'"'+(isCustom?'':' style="display:none"')+'>';
}
function wireIssuance(root,sid,cid){
  const sel=root.querySelector('#'+sid), inp=root.querySelector('#'+cid);
  if(!sel||!inp) return;
  sel.onchange=()=>{ const c=sel.value===CUSTOM; inp.style.display=c?'':'none'; if(c)inp.focus(); };
}
function issuanceValues(root,sid,cid){
  const sel=root.querySelector('#'+sid);
  if(!sel) return {issuedFor:'',description:''};
  if(sel.value===CUSTOM){
    const inp=root.querySelector('#'+cid);
    return {issuedFor:'',description:(inp&&inp.value.trim())||''};
  }
  return {issuedFor:phaseOfLabel(sel.value),description:sel.value};
}

let section='projects', view='table', q='', fStatus='all', fSector='all', fPhase='all';
let compileFor=null, compileMounted=false;

/* ── Motion ── */
const RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const D=ms=>RM?0:ms;

function toast(m){
  const r=$('toastRoot');
  clearTimeout(r._t); clearTimeout(r._t2);
  const prev=r.firstElementChild;
  if(prev){prev.classList.add('out');setTimeout(()=>prev.remove(),D(300));}
  const el=document.createElement('div'); el.className='toast'; el.textContent=m;
  r.appendChild(el);
  r._t=setTimeout(()=>{el.classList.add('out');r._t2=setTimeout(()=>el.remove(),D(320));},3400);
}

/* ═══════════ Modal ═══════════ */
function close(){
  const root=$('modalRoot'), veil=root.firstElementChild;
  if(!veil){root.innerHTML='';return;}
  if(veil.classList.contains('out'))return;
  veil.classList.add('out');
  setTimeout(()=>{if(root.firstElementChild===veil)root.innerHTML='';},D(240));
}
let quietModal=false;
function swapModal(fn){ close(); setTimeout(fn,D(200)); }

function modal(title,kicker,body,foot,wide){
  $('modalRoot').innerHTML='<div class="veil'+(quietModal?' noanim':'')+'" data-veil><div class="sheet'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+
    '<div class="sheet-hd"><div><h2>'+esc(title)+'</h2><p>'+esc(kicker)+'</p></div><button class="x" data-close aria-label="Close">&times;</button></div>'+
    '<div class="sheet-bd">'+body+'</div><div class="sheet-ft">'+foot+'</div></div></div>';
  const r=$('modalRoot');
  r.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  r.querySelector('[data-veil]').addEventListener('mousedown',e=>{if(e.target.hasAttribute('data-veil'))close();});
  const f=r.querySelector('input,textarea,select');if(f)f.focus();
  return r;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
const opts=(a,sel)=>a.map(o=>'<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>').join('');

/* ═══════════ Project form ═══════════ */
function projectForm(p){p=p||{};
  return '<div class="grid">'+
  '<div class="f full"><label for="f_name">Project <b>*</b></label><input id="f_name" type="text" value="'+esc(p.name||'')+'" placeholder="e.g. Benioff Children\'s Hospital — Tower 3"></div>'+
  '<div class="f"><label for="f_abbr">Abbreviation</label><input id="f_abbr" type="text" value="'+esc(p.abbreviation||'')+'" placeholder="BCH"><span class="hint">Used in the package filename</span></div>'+
  '<div class="f"><label for="f_num">Project number</label><input id="f_num" type="text" value="'+esc(p.number||'')+'" placeholder="24-0417"></div>'+
  '<div class="f"><label for="f_client">Client</label><input id="f_client" type="text" value="'+esc(p.client||'')+'" placeholder="UCSF Health"></div>'+
  '<div class="f"><label for="f_loc">Location</label><input id="f_loc" type="text" value="'+esc(p.location||'')+'" placeholder="San Francisco, CA"><span class="hint">Stamped on every sheet</span></div>'+
  '<div class="f"><label for="f_sector">Sector</label><select id="f_sector"><option value="">—</option>'+opts(SECTORS,p.sector)+'</select></div>'+
  '<div class="f"><label for="f_status">Status</label><select id="f_status">'+opts(STATUSES,p.status||'Active')+'</select></div>'+
  '<div class="f"><label for="f_phase">Current phase</label><select id="f_phase"><option value="">—</option>'+opts(PHASES,p.phase)+'</select></div>'+
  '<div class="f"><label for="f_lead">Lighting lead</label><input id="f_lead" type="text" value="'+esc(p.lead||'')+'"></div>'+
  '<div class="f full"><label for="f_team">Point person(s)</label><input id="f_team" type="text" value="'+esc(p.team||'')+'"></div>'+
  '<div class="f full"><label for="f_folder">Cutsheets folder</label><input id="f_folder" type="text" value="'+esc(p.cutsheetFolder||'')+'" placeholder="M:\\Mazzetti\\Projects\\26\\Engineering\\… \\Lighting\\Cutsheets"><span class="hint">Recorded here for reference. Link the folder once in the compiler and it pulls the PDFs automatically.</span></div>'+
  '<div class="f full"><label for="f_desc">Description / scope</label><textarea id="f_desc" placeholder="What the project is, and what our lighting scope covers.">'+esc(p.description||'')+'</textarea></div>'+
  '<div class="f full"><label class="check"><input type="checkbox" id="f_star"'+(p.priority?' checked':'')+'> Flag as priority project</label>'+
  '<label class="check"><input type="checkbox" id="f_tl"'+(p.onTimeline===false?'':' checked')+'> Show on timeline</label></div></div>'+
  '<details class="more"><summary>More fields (standards, controls, notes…)</summary><div class="grid">'+
  '<div class="f full"><label for="f_std">Owner standards &amp; approved manufacturers</label><textarea id="f_std">'+esc(p.standards||'')+'</textarea></div>'+
  '<div class="f full"><label for="f_ctrl">Control system</label><input id="f_ctrl" type="text" value="'+esc(p.controls||'')+'" placeholder="nLight ECLYPSE, 0–10V dim to 1%"></div>'+
  '<div class="f full"><label for="f_notes">Submittal notes / quirks</label><textarea id="f_notes">'+esc(p.notes||'')+'</textarea></div>'+
  '<div class="f full"><label for="f_q">Open questions</label><textarea id="f_q">'+esc(p.questions||'')+'</textarea></div>'+
  '</div></details>';
}
const readProject=r=>({name:val(r,'f_name'),abbreviation:val(r,'f_abbr'),number:val(r,'f_num'),client:val(r,'f_client'),location:val(r,'f_loc'),sector:val(r,'f_sector'),status:val(r,'f_status'),phase:val(r,'f_phase'),lead:val(r,'f_lead'),team:val(r,'f_team'),description:val(r,'f_desc'),cutsheetFolder:val(r,'f_folder'),priority:chk(r,'f_star'),onTimeline:chk(r,'f_tl'),standards:val(r,'f_std'),controls:val(r,'f_ctrl'),notes:val(r,'f_notes'),questions:val(r,'f_q')});

function addProject(then){
  const r=modal('Add a project','Saved straight to the shared registry',projectForm(),
    '<button class="btn" data-close>Cancel</button><button class="btn btn-dark" id="go">Save project</button>');
  r.querySelector('#go').onclick=async()=>{
    const d=readProject(r); if(!d.name){r.querySelector('#f_name').focus();return toast('Give the project a name first');}
    const p=Object.assign({id:uid('prj'),createdAt:new Date().toISOString()},d);
    reg.projects.push(p); close(); await save(); render(true); toast('Saved '+p.name);
    if(then)then(p.id);
  };
}
function editProject(id){
  const p=projOf(id);if(!p)return;
  const r=modal('Edit project','Saved straight to the shared registry',projectForm(p),
    '<button class="btn" data-close>Cancel</button><button class="btn btn-dark" id="go">Save changes</button>');
  r.querySelector('#go').onclick=async()=>{
    const d=readProject(r); if(!d.name)return toast('Give the project a name first');
    Object.assign(p,d,{updatedAt:new Date().toISOString()});
    close(); await save(); render(true); toast('Saved '+p.name);
  };
}

/* ═══════════ Manual issuance ═══════════ */
function logIssuance(projectId){
  const p=projOf(projectId), today=new Date().toISOString().slice(0,10);
  const r=modal('Log an issuance'+(p?' — '+p.name:''),'For packages produced outside this tool',
    '<div class="grid">'+
    (p?'':'<div class="f full"><label for="f_prj">Project <b>*</b></label><select id="f_prj">'+reg.projects.map(x=>'<option value="'+x.id+'">'+esc((x.abbreviation?x.abbreviation+' — ':'')+x.name)+'</option>').join('')+'</select></div>')+
    '<div class="f"><label for="f_date">Issuance date <b>*</b></label><input id="f_date" type="date" value="'+today+'"></div>'+
    '<div class="f"><label for="f_issue">Issued for / issuance description</label>'+
      issuanceControl('f_issue','f_issueCustom',p?p.phase:'','')+'</div>'+
    '<div class="f"><label for="f_pkg">Package</label><select id="f_pkg"><option>Schedule &amp; datasheets</option><option>Datasheets only</option><option>Schedule only</option><option>Revised sheets</option></select></div>'+
    '<div class="f"><label for="f_rev">Revision</label><input id="f_rev" type="text" placeholder="Rev B"></div>'+

    '<div class="f"><label for="f_pages">Pages</label><input id="f_pages" type="number" min="0"></div>'+
    '<div class="f"><label for="f_sheets">Datasheets</label><input id="f_sheets" type="number" min="0"></div>'+
    '<div class="f full"><label for="f_file">File name</label><input id="f_file" type="text"></div>'+
    '<div class="f full"><label for="f_types">Luminaire types</label><input id="f_types" type="text" placeholder="HR1B, F1, W2 — comma separated"></div>'+
    '<div class="f full"><label for="f_to">Transmitted to</label><input id="f_to" type="text"></div>'+
    '<div class="f full"><label for="f_inotes">What changed</label><textarea id="f_inotes"></textarea></div></div>',
    '<button class="btn" data-close>Cancel</button><button class="btn btn-dark" id="go">Save issuance</button>');
  wireIssuance(r,'f_issue','f_issueCustom');
  r.querySelector('#go').onclick=async()=>{
    const pid=projectId||val(r,'f_prj'); if(!pid)return toast('Pick a project first');
    const iv=issuanceValues(r,'f_issue','f_issueCustom');
    reg.issuances.push({id:uid('iss'),projectId:pid,date:val(r,'f_date')||today,issuedFor:iv.issuedFor,
      packageType:val(r,'f_pkg'),revision:val(r,'f_rev'),issuanceDescription:iv.description,
      pageCount:parseInt(val(r,'f_pages'),10)||0,
      datasheetCount:parseInt(val(r,'f_sheets'),10)||0,fileName:val(r,'f_file'),hasSchedule:/schedule/i.test(val(r,'f_pkg')),
      fixtureTags:val(r,'f_types').split(',').map(s=>s.trim()).filter(Boolean),transmittedTo:val(r,'f_to'),
      notes:val(r,'f_inotes'),recordedAt:new Date().toISOString(),manual:true});
    const p2=projOf(pid); if(p2&&iv.issuedFor)p2.phase=iv.issuedFor;
    close(); await save(); render(true); toast('Issuance logged');
  };
}

/* ═══════════ Project detail ═══════════ */
function detail(id){
  const p=projOf(id);if(!p)return;
  const iss=issFor(id), types=typesFor(id);
  const kv=(k,v)=>'<div><div class="det-k">'+k+'</div><div class="det-v'+(v?'':' dim')+'">'+esc(v||'Not recorded')+'</div></div>';
  const sec=(h,v)=>'<div class="det-sec"><h4>'+h+'</h4><p'+(v?'':' class="det-v dim"')+'>'+esc(v||'Nothing recorded yet.')+'</p></div>';
  modal((p.priority?'★ ':'')+p.name,(p.abbreviation?p.abbreviation+' · ':'')+(p.status||'Active')+(p.phase?' · '+p.phase:''),
    '<div class="det-meta">'+kv('Client',p.client)+kv('Location',p.location)+kv('Sector',p.sector)+kv('Project no.',p.number)+kv('Lighting lead',p.lead)+kv('Point person(s)',p.team)+'</div>'+
    (p.cutsheetFolder?'<div class="det-sec"><h4>Cutsheets folder</h4><p style="font-family:var(--mono);font-size:11.5px;word-break:break-all">'+esc(p.cutsheetFolder)+'</p></div>':'')+
    sec('Description / scope',p.description)+
    (types.length?'<div class="det-sec"><h4>Luminaire types on record ('+types.length+')</h4><div class="tags">'+types.map(t=>'<span class="tag tag-sky">'+esc(t)+'</span>').join('')+'</div></div>':'')+
    sec('Owner standards &amp; approved manufacturers',p.standards)+
    (p.controls?sec('Control system',p.controls):'')+
    sec('Submittal notes / quirks',p.notes)+
    (p.questions?sec('Open questions',p.questions):'')+
    '<div class="det-sec"><h4>Issuance history ('+iss.length+')</h4>'+
      (iss.length?iss.map(i=>'<div class="iss-row"><span class="iss-d">'+fmt(i.date)+'</span><span class="iss-b">'+
        '<span class="iss-t">'+esc(i.issuanceDescription||i.issuedFor||i.packageType||'Package')+(i.revision?' · '+esc(i.revision):'')+(i.manual?'':' <span class="tag tag-sage">compiled</span>')+'</span>'+

/* ═══════════════════════════════════════
   COMPILER — project-scoped
   ═══════════════════════════════════════ */
let scheduleFiles=[], datasheetFiles=[], busy=false;
let libsPromise=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function ensureLibs(){
  if(!libsPromise) libsPromise=loadScript('https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js')
    .then(()=>loadScript('https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js'));
  return libsPromise;
}

// Fixture tag = the first token of the filename, where a token ends at the
// first underscore OR space. Dashes are kept, so sensor variants stay intact.
//   "S1-S_HEW_Strip Light 75R-75S"      -> "S1-S"
//   "S8-S SERIES_Finelite_HP6_Surface"  -> "S8-S"   (space ends the token too)
//   "P1_Finelite_HP4_Circle_2FT DIA"    -> "P1"
//   "R1-S"                              -> "R1-S"
function fixtureTag(nameNoExt){
  if(!nameNoExt) return '';
  return (String(nameNoExt).trim().split(/[\s_]+/)[0]||'').trim();
}

// A luminaire type looks like P1, R6, P4-S, S8-S, W1-S, X1, HR1B — letters,
// then a number, optionally a trailing letter and a -SUFFIX. This is what
// separates a fixture cutsheet from the binders, permit sets and control
// cutsheets that also live in the folder ("260722 Cutsheet Binder",
// "Lutron seeTouch Wall Stations QSWS2", …).
const TAG_RE=/^[A-Z]{1,3}\d{1,3}[A-Z]?(?:\.\d{1,2})?(?:-[A-Z0-9,]{1,6})?$/i;
const isFixtureTag=t=>!!t&&TAG_RE.test(t);
const isFixtureFile=f=>isFixtureTag(fixtureTag(String(f.name||'').replace(/\.pdf$/i,'')));

// Shared by the page stamp and the cover page.
const ADDRESS_LINES=["SAN FRANCISCO | 220 Montgomery Street Ste 1019 San Francisco, CA 94104 USA +1 415 362 3266",
                     "www.mazzetti.com"];

/* ═══════════ Linked cutsheets folder ═══════════
   A browser cannot open a path from a string — the folder has to be chosen
   through the OS picker at least once. What it CAN do is keep the resulting
   FileSystemDirectoryHandle, so that pick happens once per project and every
   later compile reads the folder directly. The handle lives in IndexedDB keyed
   by project id; the human-readable path stays on the project record.

   Chrome/Edge only (File System Access API). Where it's unavailable the panel
   quietly falls back to drag-and-drop. */
const FS_OK = typeof window.showDirectoryPicker === 'function';
const IDB_NAME='mazzetti:cutsheet-folders', IDB_STORE='handles';
// Any PDF whose name contains "schedule" is treated as the fixture schedule.
const SCHEDULE_RE=/schedule/i;
// Packages this tool wrote into the folder — current naming and the older
// LTLD/LTLS scheme. They must never be read back in as source material.
const OUTPUT_RE=/(^LTL[SD]-|[-\s]Luminaire Cutsheets(\s*\(\d+\))?\.pdf$)/i;

function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked'));
  });
}
async function idbTx(mode,fn){
  const db=await idbOpen();
  try{
    return await new Promise((res,rej)=>{
      const req=fn(db.transaction(IDB_STORE,mode).objectStore(IDB_STORE));
      req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
    });
  } finally { db.close(); }
}
const folderGet=id=>idbTx('readonly',st=>st.get(id)).catch(()=>null);
const folderPut=(id,h)=>idbTx('readwrite',st=>st.put(h,id)).then(()=>true).catch(()=>false);
const folderDel=id=>idbTx('readwrite',st=>st.delete(id)).then(()=>true).catch(()=>false);

/* ── Output naming ──
   "YYYYMMDD - Project Name - Issuance Description - Luminaire Cutsheets.pdf"
   Empty parts are dropped rather than leaving " -  - " gaps. */
function safePart(s){
  return String(s==null?'':s)
    .replace(/[\\/:*?"<>|]/g,'-')   // characters Windows won't accept in a name
    .replace(/\s+/g,' ')
    .replace(/\s*-\s*-\s*/g,' - ')
    .trim().replace(/[.\s]+$/,'');
}
function packageFileName(fileDate,projectName,issuanceDescription){
  const parts=[fileDate,safePart(projectName),safePart(issuanceDescription)].filter(Boolean);
  parts.push('Luminaire Cutsheets');
  return parts.join(' - ')+'.pdf';
}

/** Write the finished package into the linked folder. Never overwrites blindly. */
async function writeToFolder(bytes,name){
  if(!folderHandle) return {ok:false,reason:'no folder linked'};
  if(typeof folderHandle.getFileHandle!=='function') return {ok:false,reason:'folder writing unsupported'};
  const perm=await folderPerm(folderHandle,true);
  if(perm!=='granted') return {ok:false,reason:'the browser did not grant write access'};
  const exists=async n=>{ try{ await folderHandle.getFileHandle(n); return true; }catch(e){ return false; } };
  let target=name;
  try{
    if(await exists(target)){
      const keep=!confirm('“'+target+'” already exists in the Cutsheets folder.\n\n'+
                          'OK — overwrite it\nCancel — keep both, save this one as a numbered copy');
      if(keep){
        const base=target.replace(/\.pdf$/i,'');
        let n=2, candidate;
        do{ candidate=base+' ('+n+').pdf'; n++; } while(await exists(candidate) && n<100);
        target=candidate;
      }
    }
    const fh=await folderHandle.getFileHandle(target,{create:true});
    if(typeof fh.createWritable!=='function') return {ok:false,reason:'folder writing unsupported'};
    const w=await fh.createWritable();
    await w.write(bytes);
    await w.close();
    return {ok:true,name:target};
  }catch(e){
    return {ok:false,reason:(e&&e.message)||String(e)};
  }
}

/** 'granted' | 'prompt' | 'denied'. Only call with request=true from a click. */
async function folderPerm(h,request){
  if(!h) return 'denied';
  if(typeof h.queryPermission!=='function') return 'granted';   // stub / older impl
  // readwrite throughout: the compiled package is written back into this folder.
  const opts={mode:'readwrite'};
  let st=await h.queryPermission(opts);
  if(st!=='granted' && request && typeof h.requestPermission==='function') st=await h.requestPermission(opts);
  return st;
}

/** Every top-level PDF in the folder, split into schedule vs datasheets. */
async function readFolder(h){
  const pdfs=[];
  for await (const entry of h.values()){
    if(entry.kind!=='file' || !/\.pdf$/i.test(entry.name)) continue;
    pdfs.push(await entry.getFile());
  }
  const byName=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'});
  // Drop our own previous output first, before the schedule test — otherwise a
  // package whose issuance description mentions a schedule would be pulled in.
  const priorPackages=pdfs.filter(f=>OUTPUT_RE.test(f.name)).sort(byName);
  const source=pdfs.filter(f=>!OUTPUT_RE.test(f.name));
  const sched=source.filter(f=>SCHEDULE_RE.test(f.name)).sort(byName);
  const rest=source.filter(f=>!SCHEDULE_RE.test(f.name));
  // Only genuine fixture cutsheets. Binders, permit sets, comparison guides and
  // control-equipment cutsheets stay out — they're reported, never silently dropped.
  const sheets=rest.filter(isFixtureFile).sort(byName);
  const ignored=rest.filter(f=>!isFixtureFile(f)).sort(byName);
  return {schedule:sched.slice(0,1), extraSchedules:sched.slice(1),
          datasheets:sheets, ignored, priorPackages, total:pdfs.length};
}
const stagedTags=()=>[...new Set(datasheetFiles.map(f=>fixtureTag(f.name.replace(/\.pdf$/i,''))).filter(Boolean))];

function fbNote(msg,kind){ const el=$('fbNote'); if(el){el.className='fb-note'+(kind?' '+kind:'');el.textContent=msg;} }

async function linkFolder(p){
  try{
    const h=await window.showDirectoryPicker({id:'mz-cutsheets',mode:'readwrite'});
    folderHandle=h;
    const saved=await folderPut(p.id,h);
    renderFolderBar(p);
    if(!saved) fbNote('Linked for this session only — the browser wouldn’t store the folder.','warn');
    // Record the leaf name if the project has no path yet, as a breadcrumb.
    if(!p.cutsheetFolder){ p.cutsheetFolder='…\\'+h.name; await save(); }
    await pullFolder(p,{request:true});
  }catch(e){
    if(e && e.name==='AbortError') return;            // user closed the picker
    fbNote('Could not link that folder: '+(e&&e.message||e),'err');
  }
}

/** Load the linked folder into the staging lists. Returns true on success. */
async function pullFolder(p,{request=false,quiet=false}={}){
  if(!folderHandle) return false;
  try{
    const st=await folderPerm(folderHandle,request);
    if(st!=='granted'){
      fbNote(st==='denied'
        ? 'Access to the folder was denied. Relink it, or drag the PDFs in below.'
        : 'The browser needs permission again — click “Reload now” and allow it.','warn');
      return false;
    }
    const r=await readFolder(folderHandle);
    if(!r.total){ fbNote('No PDFs found in '+folderHandle.name+'.','warn'); return false; }
    if(!r.datasheets.length && !r.schedule.length){
      fbNote('Found '+r.total+' PDF'+(r.total===1?'':'s')+' in '+folderHandle.name+
             ', but none look like fixture cutsheets (a name has to start with a luminaire '+
             'type such as P1, R6 or S8-S). Drag the ones you want in below.','warn');
      return false;
    }
    datasheetFiles=r.datasheets; scheduleFiles=r.schedule; seenFiles.clear();
    renderFiles(); refreshDelta();
    const bits=[r.datasheets.length+' fixture cutsheet'+(r.datasheets.length===1?'':'s')];
    if(r.schedule.length) bits.push('schedule: '+r.schedule[0].name);
    let msg='Loaded '+bits.join(' · ')+'.';
    const skipped=r.ignored.concat(r.extraSchedules,r.priorPackages);
    if(skipped.length){
      msg+=' Skipped '+skipped.length+' other PDF'+(skipped.length===1?'':'s')+' in the folder.';
    }
    fbNote(msg,'ok');
    if(skipped.length){
      const el=$('fbNote');
      if(el){
        const d=document.createElement('details');
        d.style.marginTop='5px';
        d.innerHTML='<summary style="cursor:pointer">show skipped</summary>'+
          '<div style="margin-top:4px">'+skipped.map(f=>'· '+esc(f.name)).join('<br>')+'</div>';
        el.appendChild(d);
      }
    }
    if(!quiet) toast(msg);
    return true;
  }catch(e){
    fbNote('Could not read the folder: '+(e&&e.message||e)+'. It may have moved, or the drive isn’t mounted.','err');
    return false;
  }
}

async function initFolder(p){
  renderFolderBar(p);
  if(!FS_OK) return;
  folderHandle=await folderGet(p.id);
  if(!folderHandle){ renderFolderBar(p); return; }
  renderFolderBar(p);
  // Silent pull only if permission already stands; otherwise wait for a click.
  const st=await folderPerm(folderHandle,false);
  if(st==='granted') await pullFolder(p,{quiet:true});
  else fbNote('Folder is linked. Generating (or “Reload now”) will ask the browser for access.','warn');
}

function dropZone(el,kind){
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('on');});
  el.addEventListener('dragleave',e=>{e.preventDefault();el.classList.remove('on');});
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('on');addFiles(e.dataTransfer.files,kind);});
}
function addFiles(list,kind){
  const files=Array.from(list).filter(f=>/\.pdf$/i.test(f.name));
  if(!files.length)return;
  if(kind==='s') scheduleFiles=files.slice(0,1);
  else{
    const have=new Set(datasheetFiles.map(f=>f.name));
    const added=files.filter(f=>!have.has(f.name));
    datasheetFiles.push(...added);
    datasheetFiles.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
    // Files you drop in yourself are always kept — you asked for them — but a
    // name that doesn't start with a luminaire type would stamp something odd.
    const odd=added.filter(f=>!isFixtureFile(f));
    if(odd.length) fbNote(odd.length+' added file'+(odd.length===1?'':'s')+
      ' won\u2019t stamp a proper luminaire type: '+odd.slice(0,3).map(f=>f.name).join(', ')+
      (odd.length>3?' …':'')+'. Rename or remove them.','warn');
  }
  renderFiles(); refreshDelta();
}
const seenFiles=new Set();

function renderFiles(){

function refreshDelta(){ const p=projOf(compileFor); if(!p)return; const prev=issFor(p.id)[0]; renderDelta(prev?(prev.fixtureTags||[]):[],prev); }
function renderDelta(prevTypes,prev){
  const box=$('deltaBox'); if(!box)return;

  if(!now.length){ box.innerHTML='<p class="pnl-note" style="margin:0">Add datasheets and this compares the package against the last issuance on record.</p>'; return; }

    '<p class="pnl-note" style="margin:0">First package for this project — nothing to compare against yet.</p></div>'; return; }

/* ── Stamping (unchanged from the standalone compiler) ── */
function applyStamps(page,PDFLibRef,fonts,d){
  const {rgb}=PDFLibRef;
  const ink=rgb(40/255,40/255,40/255), addr=rgb(65/255,64/255,66/255);
  const startX=0.75*72, yAdj=0.125*72;
  const nameSize=12,dateSize=7,locSize=7,tagSize=28,labelSize=7;
  const yName=(1.25*72)-yAdj, endX=page.getWidth()-(0.5*72);
  if(d.projectName)page.drawText(d.projectName,{x:startX,y:yName,font:fonts.bold,size:nameSize,color:ink});
  if(d.projectLocation)page.drawText(d.projectLocation,{x:startX,y:yName-nameSize-2,font:fonts.reg,size:locSize,color:ink});
  const nameH=fonts.bold.heightAtSize(nameSize), tagH=fonts.bold.heightAtSize(tagSize);
  const yTag=yName+(nameH/2)-(tagH/2);
  const tagW=fonts.bold.widthOfTextAtSize(d.fixtureTag,tagSize);
  page.drawText(d.fixtureTag,{x:endX-tagW,y:yTag,font:fonts.bold,size:tagSize,color:ink});
  const aSize=6, aLH=fonts.reg.heightAtSize(aSize);
  const aStart=yTag-tagH-4; let ay=aStart;
  ADDRESS_LINES.forEach(l=>{const w=fonts.reg.widthOfTextAtSize(l,aSize);page.drawText(l,{x:endX-w,y:ay,font:fonts.reg,size:aSize,color:addr});ay-=(aLH+2);});
  page.drawText("MAZZETTI LIGHTING DESIGN STUDIO",{x:startX,y:aStart,font:fonts.bold,size:locSize,color:addr});
  const yDate=(1.75*72)-yAdj, lineY=yDate-4;
  page.drawLine({start:{x:startX,y:lineY},end:{x:endX,y:lineY},thickness:(1/32)*72,color:rgb(0,101/255,149/255)});
  const yBelow=lineY-labelSize-4;
  page.drawText("Project",{x:startX,y:yBelow,font:fonts.reg,size:labelSize,color:ink});
  const lum="Luminaire Type", lumW=fonts.reg.widthOfTextAtSize(lum,labelSize);
  page.drawText(lum,{x:endX-lumW,y:yBelow,font:fonts.reg,size:labelSize,color:ink});
  const pg='Page '+d.currentPage+' of '+d.totalPages, pgW=fonts.reg.widthOfTextAtSize(pg,dateSize);
  page.drawText(pg,{x:endX-pgW,y:yDate,font:fonts.reg,size:dateSize,color:ink});
  // Issuance line (bottom-left): date, then description behind a divider,
  // e.g. "August 7, 2026  ·  100% Construction Documents".
  let ix=startX;
  if(d.issuanceDate){
    page.drawText(d.issuanceDate,{x:ix,y:yDate,font:fonts.reg,size:dateSize,color:ink});
    ix+=fonts.reg.widthOfTextAtSize(d.issuanceDate,dateSize);
  }
  if(d.issuanceDescription){
    if(d.issuanceDate){
      const sep="   ·   ";
      page.drawText(sep,{x:ix,y:yDate,font:fonts.reg,size:dateSize,color:addr});
      ix+=fonts.reg.widthOfTextAtSize(sep,dateSize);
    }
    page.drawText(d.issuanceDescription,{x:ix,y:yDate,font:fonts.reg,size:dateSize,color:ink});
  }
}

/* ── Cover page (matches the standalone v2 compiler) ── */
function drawCoverPage(doc,PDFLibRef,fonts,info){
  const {rgb,PageSizes}=PDFLibRef;
  const [W,H]=PageSizes.Letter;
  const page=doc.insertPage(0,PageSizes.Letter);
  const brand=rgb(0,101/255,149/255), accent=rgb(185/255,179/255,9/255);
  const ink=rgb(31/255,41/255,51/255), muted=rgb(91/255,107/255,115/255), white=rgb(1,1,1);
  const margin=0.75*72, bandH=1.9*72;
  page.drawRectangle({x:0,y:H-bandH,width:W,height:bandH,color:brand});
  page.drawRectangle({x:0,y:H-bandH,width:W,height:3,color:accent});
  page.drawText("MAZZETTI",{x:margin,y:H-0.85*72,font:fonts.bold,size:26,color:white});
  page.drawText("LIGHTING DESIGN STUDIO",{x:margin,y:H-1.12*72,font:fonts.reg,size:9,color:rgb(215/255,232/255,240/255)});
  const marker="LUMINAIRE PACKAGE", markerW=fonts.bold.widthOfTextAtSize(marker,10);
  page.drawText(marker,{x:W-margin-markerW,y:H-0.85*72,font:fonts.bold,size:10,color:white});
  let cy=H-bandH-0.85*72;
  const nameSize=30, name=info.projectName||"Untitled Project", maxW=W-margin*2;
  let line='', lines=[];
  for(const w of name.split(' ')){
    const test=line?line+' '+w:w;
    if(fonts.bold.widthOfTextAtSize(test,nameSize)>maxW&&line){lines.push(line);line=w;}
    else line=test;
  }
  if(line)lines.push(line);
  for(const ln of lines){page.drawText(ln,{x:margin,y:cy,font:fonts.bold,size:nameSize,color:ink});cy-=nameSize*1.1;}
  cy-=6;
  page.drawRectangle({x:margin,y:cy,width:64,height:3,color:accent});
  cy-=0.55*72;
  [["PROJECT LOCATION",info.projectLocation],["ABBREVIATION",info.projectAbbreviation],
   ["ISSUANCE DATE",info.issuanceDate],["ISSUANCE DESCRIPTION",info.issuanceDescription]]
   .filter(r=>r[1]).forEach(([label,value])=>{
    page.drawText(label,{x:margin,y:cy,font:fonts.bold,size:8,color:muted});
    page.drawText(String(value),{x:margin,y:cy-16,font:fonts.reg,size:13,color:ink});
    cy-=0.62*72;
  });
  const footY=0.9*72;
  page.drawLine({start:{x:margin,y:footY},end:{x:W-margin,y:footY},thickness:1,color:rgb(214/255,222/255,227/255)});
  page.drawText("MAZZETTI LIGHTING DESIGN STUDIO",{x:margin,y:footY-16,font:fonts.bold,size:7,color:muted});
  const cSize=6, cLH=fonts.reg.heightAtSize(cSize)+3;
  let ay=footY-30;
  ADDRESS_LINES.forEach(l=>{page.drawText(l,{x:margin,y:ay,font:fonts.reg,size:cSize,color:muted});ay-=cLH;});
  return page;
}
function addBookmarks(doc,marks,PDFLibRef){
  if(!marks.length)return;
  const {PDFName,PDFHexString}=PDFLibRef, ctx=doc.context;
  const outRef=ctx.nextRef(), refs=marks.map(()=>ctx.nextRef());
  ctx.assign(outRef,ctx.obj({Type:'Outlines',Count:marks.length,First:refs[0],Last:refs[refs.length-1]}));
  marks.forEach((m,i)=>{
    const dest=ctx.obj([doc.getPage(m.pageIndex).ref,PDFName.of('Fit')]);
    ctx.assign(refs[i],ctx.obj(Object.assign({Title:PDFHexString.fromText(m.title),Parent:outRef,Dest:dest},
      i>0?{Prev:refs[i-1]}:{}, i<marks.length-1?{Next:refs[i+1]}:{})));
  });
  doc.catalog.set(PDFName.of('Outlines'),outRef);
  doc.catalog.set(PDFName.of('PageMode'),PDFName.of('UseOutlines'));
}

async function generate(preview){
  if(busy)return;
  // Pull the linked folder before any other await: requestPermission() needs the
  // click's user activation, which a long await would spend.
  if(folderHandle && (!$('cPull') || chk(document,'cPull'))){
    setStatus('Reading the linked folder…');
    const ok=await pullFolder(projOf(compileFor)||{},{request:true});
    if(!ok){ setStatus('Could not read the linked folder — see the note above the file list.','err'); return; }
  }
  if(!datasheetFiles.length)return setStatus('Add at least one datasheet PDF to continue.','err');
  setBusy(true,preview?'preview':'gen'); setStatus(preview?'Building preview…':'Reading files…');
  if(!preview){$('track').classList.add('on');$('fill').style.width='0%';}
  try{
    await ensureLibs();
    const L=window.PDFLib, {PDFDocument,StandardFonts,PDFName,PageSizes}=L;
    const projectName=val(document,'cName'), abbr=val(document,'cAbbr'), loc=val(document,'cLoc'), raw=val(document,'cDate');
    const iss=issuanceValues(document,'cIssue','cIssueCustom');
    const issDesc=iss.description;
    let pretty='', fileDate='';
    if(raw){pretty=new Date(raw+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});fileDate=raw.replace(/-/g,'');}

    let total=0, done=0;
    if(!preview){
      if(scheduleFiles.length){const b=await readBuf(scheduleFiles[0]);total+=(await PDFDocument.load(b,{ignoreEncryption:true})).getPageCount();}
      const counts=await Promise.all(datasheetFiles.map(async f=>(await PDFDocument.load(await readBuf(f),{ignoreEncryption:true})).getPageCount()));
      total+=counts.reduce((a,b)=>a+b,0);
    }
    const out=await PDFDocument.create(), marks=[];
    const fonts={reg:await out.embedFont(StandardFonts.Helvetica),bold:await out.embedFont(StandardFonts.HelveticaBold)};
    const [W,H]=PageSizes.Letter, m={top:.5*72,bottom:1.75*72,left:72,right:72};
    const pw=W-m.left-m.right, ph=H-m.top-m.bottom;
    const bump=(msg)=>{if(preview||!total)return;$('fill').style.width=Math.round(done/total*100)+'%';setStatus(msg+' ('+Math.round(done/total*100)+'%)');};

    if(!preview&&scheduleFiles.length){
      marks.push({title:'Fixture Schedule',pageIndex:out.getPageCount()});
      const sd=await PDFDocument.load(await readBuf(scheduleFiles[0]),{ignoreEncryption:true});
      const cp=await out.copyPages(sd,sd.getPageIndices());
      for(const pg of cp){out.addPage(pg);done++;bump('Adding schedule');await new Promise(r=>setTimeout(r,0));}
    }
    const files=preview?datasheetFiles.slice(0,1):datasheetFiles;
    for(const f of files){
      const noExt=f.name.replace(/\.pdf$/i,''), tag=fixtureTag(noExt);
      if(!preview)marks.push({title:noExt,pageIndex:out.getPageCount()});
      const src=await PDFDocument.load(await readBuf(f),{ignoreEncryption:true});
      const pages=src.getPages(), n=pages.length, use=preview?pages.slice(0,1):pages;
      // Embed a datasheet's pages in ONE pass. embedPage() per page runs a fresh
      // copier each time, so shared fonts and images get duplicated for every
      // page — that alone was inflating a 13 MB source set to a 130 MB package.
      const usableIdx=[], usable=[];
      use.forEach((op,j)=>{ if(op.node.has(PDFName.of('Contents'))){usableIdx.push(j);usable.push(op);} });
      let embeds=null;
      try{ embeds=await out.embedPages(usable); }catch(e){ embeds=null; }
      const byIdx={}; if(embeds) usableIdx.forEach((j,k)=>{ byIdx[j]=embeds[k]; });
      for(let j=0;j<use.length;j++){
        bump('Stamping '+tag);
        const op=use[j];
        if(!op.node.has(PDFName.of('Contents'))){done++;continue;}
        let ep=byIdx[j];
        if(!ep){ try{ep=await out.embedPage(op);}catch(e){done++;continue;} }
        const {width:ow,height:oh}=op.getSize(), sc=Math.min(pw/ow,ph/oh), sw=ow*sc, sh=oh*sc;
        const np=out.addPage(PageSizes.Letter);
        np.drawPage(ep,{x:m.left+(pw-sw)/2,y:m.bottom+(ph-sh)/2,width:sw,height:sh});
        applyStamps(np,L,fonts,{projectName,projectLocation:loc,issuanceDate:pretty,issuanceDescription:issDesc,fixtureTag:tag,currentPage:j+1,totalPages:n});
        if(!preview){done++;await new Promise(r=>setTimeout(r,0));}
      }
    }
    if(!preview){
      // insertPage(0,…) pushes every existing page back one, so shift the
      // captured bookmark indices and put Cover at the front.
      drawCoverPage(out,L,fonts,{projectName,projectLocation:loc,projectAbbreviation:abbr,
        issuanceDate:pretty,issuanceDescription:issDesc});
      marks.forEach(m=>{m.pageIndex+=1;});
      marks.unshift({title:'Cover',pageIndex:0});
    }
    if(!preview&&marks.length)addBookmarks(out,marks,L);
    const bytes=await out.save();

    if(preview){
      const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      window.open(url,'_blank'); setTimeout(()=>URL.revokeObjectURL(url),1000);
      setStatus('Preview opened in a new tab.','ok'); return;
    }

    const hasSched=scheduleFiles.length>0;
    let fileName=packageFileName(fileDate,projectName,issDesc);
    const pages=out.getPageCount();

    // Save into the linked Cutsheets folder when we can; fall back to a download.
    let savedTo='', downloaded=false;
    const wantSave=folderHandle && (!$('cSaveHere') || chk(document,'cSaveHere'));
    if(wantSave){
      setStatus('Saving into the Cutsheets folder…');
      const w=await writeToFolder(bytes,fileName);
      if(w.ok){ savedTo=w.name; fileName=w.name; }
      else fbNote('Could not save into the folder ('+w.reason+') — downloading instead.','warn');
    }
    if(!savedTo || ($('cAlsoDl') && chk(document,'cAlsoDl'))){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      a.download=fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(a.href),100);
      downloaded=true;
    }
    setStatus(pages+' pages compiled — '+
      (savedTo?'saved to the Cutsheets folder as “'+esc(savedTo)+'”'+(downloaded?' and downloaded':'')
              :'downloaded as “'+esc(fileName)+'”')+'.','ok');
    if(fileName.length>120) fbNote('That filename is '+fileName.length+' characters. Combined with a deep '+
      'server path it can approach the Windows 260-character limit — consider a shorter issuance description.','warn');

    /* ── Write back to the record ── */
    const p=projOf(compileFor);
    if(p){
      if(projectName&&projectName!==p.name)p.name=projectName;
      if(abbr&&abbr!==p.abbreviation)p.abbreviation=abbr;
      if(loc&&loc!==p.location)p.location=loc;
      const issuedFor=iss.issuedFor;
      if(chk(document,'cSync')&&issuedFor)p.phase=issuedFor;
      p.updatedAt=new Date().toISOString();
      if(chk(document,'cLog')){
        reg.issuances.push({id:uid('iss'),projectId:p.id,date:raw||new Date().toISOString().slice(0,10),
          issuedFor,revision:val(document,'cRev'),packageType:hasSched?'Schedule & datasheets':'Datasheets only',
          issuanceDescription:issDesc,
          fileName,pageCount:pages,datasheetCount:datasheetFiles.length,hasSchedule:hasSched,
          fixtureTags:stagedTags(),transmittedTo:val(document,'cTo'),notes:val(document,'cNotes'),
          recordedAt:new Date().toISOString()});
        await save(); renderRail(); refreshDelta();
        setStatus(pages+' pages compiled — '+
          (savedTo?'saved to the Cutsheets folder as “'+esc(savedTo)+'”':'downloaded as “'+esc(fileName)+'”')+
          ' — and logged to '+esc(p.abbreviation||p.name)+'.','ok');
        toast('Logged to '+(p.abbreviation||p.name));
      } else { await save(); renderRail(); }
    }
  }catch(err){
    console.error(err); setStatus('Error: '+esc(err.message||String(err)),'err');
  }finally{
    setBusy(false);
    if(!preview&&$('track')){const tr=$('track');setTimeout(()=>{tr.classList.remove('on');setTimeout(()=>{if(!tr.classList.contains('on'))$('fill').style.width='0%';},D(360));},D(500));}
  }
}

/* ═══════════ Views ═══════════ */
function visible(){
  return reg.projects.filter(p=>{
    if(fStatus!=='all'&&(p.status||'Active')!==fStatus)return false;
    if(fSector!=='all'&&(p.sector||'')!==fSector)return false;
    if(fPhase!=='all'&&(p.phase||'')!==fPhase)return false;
    if(!q)return true;
    return [p.name,p.abbreviation,p.number,p.client,p.location,p.sector,p.lead,p.team,p.description,p.standards,p.notes].concat(typesFor(p.id)).join(' ').toLowerCase().includes(q.toLowerCase());
  }).sort((a,b)=>{
    if(!!b.priority!==!!a.priority)return b.priority?1:-1;
    const ai=issFor(a.id)[0],bi=issFor(b.id)[0], ad=ai?ai.date:'', bd=bi?bi.date:'';
    return ad!==bd?String(bd).localeCompare(String(ad)):a.name.localeCompare(b.name);
  });
}
