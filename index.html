<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoPak Cutsheet Compiler — Mazzetti Lighting Design Studio</title>
<link rel="icon" type="image/svg+xml" href="mz-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Auth gating uses the hidden attribute on elements whose own rules set a
   display value (.app is grid, #authGate is flex, nav buttons are flex).
   Those author rules beat the browser's [hidden]{display:none}, so state
   this explicitly or nothing ever actually hides. */
[hidden]{display:none !important}

:root{
  --brand:#006595;--brand-deep:#00506f;--ink:#141719;--paper:#fff;--field:#fafaf8;--line:#e6e4df;
  --line-strong:#cfccc5;--muted:#7a7770;
  --sand:#f2e6d8;--sand-line:#e0cdb6;--sand-ink:#8a6338;
  --sage:#e4ebe5;--sage-line:#c6d6c9;--sage-ink:#3f6349;
  --sky:#e2ecf2;--sky-line:#bcd4e0;--sky-ink:#0d5678;
  --red:#b2432a;
  --display:'Archivo Black Embedded','Archivo',-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}

/* Rail */
.rail{border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto}
.mark{display:block;padding:0 6px}
.mark-logo{display:block;width:100%;max-width:184px;height:auto;color:var(--ink)}
.mark-word{display:block;font-family:var(--display);font-size:12.6px;line-height:1;color:var(--ink);margin-top:3px;white-space:nowrap}
.mark-app{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0 10px 8px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;font:inherit;font-size:14.5px;color:var(--ink);padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .28s cubic-bezier(.4,0,.2,1),color .28s cubic-bezier(.4,0,.2,1),transform .16s ease}
.nav button:active{transform:translateX(2px)}
.dot{transition:background .28s ease}
.nav button:hover{background:var(--field)}
.nav button[aria-current="true"]{background:var(--ink);color:#fff}
.nav button[aria-current="true"] .dot{background:#fff}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong);flex-shrink:0}
.nav .make{margin-top:8px;border:1px dashed var(--line-strong);justify-content:center;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.nav .make:hover{border-color:var(--ink);background:var(--field)}
.rail-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:7px}
.rail-stat{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.rail-stat b{color:var(--ink);font-weight:600}

/* Head */
main{min-width:0;padding:30px clamp(18px,3.5vw,44px) 70px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:22px;flex-wrap:wrap}
h1{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sheet-sub{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:5px}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:18px}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{background:none;border:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:8px 13px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line);transition:background .3s cubic-bezier(.4,0,.2,1),color .3s cubic-bezier(.4,0,.2,1)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--field);color:var(--ink);font-weight:600}
select,input[type=search],input[type=text],input[type=number],input[type=date],textarea{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,101,149,.13)}
.toolbar input[type=search]{flex:1;min-width:180px;background:var(--field)}
.spacer{flex:1}
.pill-count{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 12px;white-space:nowrap}
.pill-sync{font-family:var(--mono);font-size:12px;border-radius:99px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--sage-line);background:var(--sage);color:var(--sage-ink)}
.pill-sync.warn{border-color:var(--sand-line);background:var(--sand);color:var(--sand-ink)}
.pill-sync i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.btn{font-family:var(--sans);font-size:14px;font-weight:600;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);white-space:nowrap;transition:background .26s cubic-bezier(.4,0,.2,1),border-color .26s cubic-bezier(.4,0,.2,1),color .26s cubic-bezier(.4,0,.2,1),box-shadow .26s ease,transform .14s ease,opacity .26s ease}
.btn:active:not(:disabled){transform:translateY(1px) scale(.985)}
.btn-dark:hover{box-shadow:0 4px 14px rgba(20,23,25,.22)}
.btn:hover{background:var(--field)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-ghost{border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);background:var(--field)}
.btn-danger{color:var(--red)}
.btn-danger:hover{background:#fdf1ee;border-color:var(--red)}
.btn-sm{font-size:13px;padding:6px 11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,.nav button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono-btn{font-family:var(--mono);font-size:12px;letter-spacing:.06em}

/* Table */
.tbl{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tbl thead th{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--ink);text-align:left;padding:10px 12px;font-weight:500;white-space:nowrap}
.tbl td{border-top:1px solid var(--line);padding:11px 12px;vertical-align:top;font-size:14.5px}
.tbl tbody tr{cursor:pointer;transition:background .24s cubic-bezier(.4,0,.2,1)}
.tbl tbody tr:hover{background:var(--field)}
.t-abbr{font-family:var(--mono);font-size:13px;font-weight:600}
.t-name{font-weight:600}
.t-dim{color:var(--muted);font-size:13.5px}
.star{color:var(--sand-ink)}
.row-btn{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-strong);background:var(--paper);border-radius:99px;padding:4px 9px;cursor:pointer;color:var(--muted);transition:border-color .26s ease,color .26s ease,background .26s ease,transform .14s ease}
.row-btn:active{transform:scale(.94)}
.row-btn:hover{border-color:var(--ink);color:var(--ink)}

.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:99px;white-space:nowrap;border:1px solid var(--line-strong);color:var(--muted);background:var(--paper)}
.tag-sand{background:var(--sand);border-color:var(--sand-line);color:var(--sand-ink)}
.tag-sage{background:var(--sage);border-color:var(--sage-line);color:var(--sage-ink)}
.tag-sky{background:var(--sky);border-color:var(--sky-line);color:var(--sky-ink)}
.tag-ink{background:var(--ink);border-color:var(--ink);color:#fff}
/* Solid, not tinted like the status tags: an unlinked folder is the one
   state that stops the compiler reading anything by itself. */
.tag-red{background:var(--red);border-color:var(--red);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:4px}

/* Board / timeline */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
.col-head{display:flex;align-items:center;gap:8px;padding:0 2px 10px;border-bottom:1px solid var(--ink);margin-bottom:12px}
.col-title{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.col-count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
.card{border:1px solid var(--line);border-radius:8px;padding:13px;cursor:pointer;margin-bottom:10px;transition:border-color .28s cubic-bezier(.4,0,.2,1),box-shadow .28s cubic-bezier(.4,0,.2,1),transform .22s cubic-bezier(.4,0,.2,1)}
.card:hover{border-color:var(--ink);box-shadow:0 6px 18px rgba(20,23,25,.08);transform:translateY(-2px)}
.card:active{transform:translateY(0)}
.card-top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.card-name{font-weight:600;font-size:15px;line-height:1.3;margin-bottom:4px}
.card-meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.7}
.card-foot{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}
/* Month calendar on the timeline view */
.cal{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.cal-hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--field);flex-wrap:wrap}
.cal-title{font-weight:700;font-size:16px;min-width:160px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-grid>:nth-child(7n){border-right:none}
.cal-dow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cal-day{min-height:86px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px;display:flex;flex-direction:column;gap:3px}
.cal-n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.cal-day.out{background:var(--field)}
.cal-day.out .cal-n{opacity:.4}
.cal-day.today{background:var(--sky)}
.cal-day.today .cal-n{color:var(--sky-ink);font-weight:700}
.cal-ev{display:block;min-width:0;font-family:var(--mono);font-size:10.5px;line-height:1.3;background:var(--ink);color:#fff;border-radius:4px;padding:3px 6px;cursor:pointer;overflow:hidden;transition:background .2s ease}
.cal-ev-p,.cal-ev-i{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev-i{font-size:9.5px;opacity:.82}
/* Overflow control. The expanded day floats its full list over the grid
   instead of growing the cell, because grid rows share a height — a tall
   cell would drag the whole week down with it. */
.cal-more{font-family:var(--mono);font-size:9.5px;background:var(--field);color:var(--muted);border:1px dashed var(--line-strong);border-radius:4px;padding:2px 5px;cursor:pointer;text-align:left;line-height:1.3;transition:border-color .2s ease,color .2s ease}
.cal-more:hover{border-color:var(--ink);color:var(--ink)}
.cal-day.expanded{position:relative;z-index:5}
.cal-pop{position:absolute;left:-1px;right:-1px;top:22px;background:var(--paper);border:1px solid var(--ink);border-radius:6px;box-shadow:0 12px 28px rgba(20,23,25,.2);padding:6px;display:flex;flex-direction:column;gap:3px;max-height:240px;overflow-y:auto;z-index:6}
.cal-less{font-family:var(--mono);font-size:9.5px;background:none;border:none;color:var(--muted);cursor:pointer;text-align:left;padding:2px 4px;margin-top:1px}
.cal-less:hover{color:var(--ink)}
.cal-ev:hover{background:var(--brand);filter:brightness(1.12)}
/* Month/year pickers, day selection and the selected-day strip */
.cal-hd input.cal-d{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:5px 7px}
.f-row{display:flex;gap:7px;align-items:stretch}
.f-row input{flex:1;min-width:0}
.f-row .btn{white-space:nowrap}
.sw-pick{border-style:dashed;color:var(--muted)}
.sw-pick:not(.on){background:var(--field)}
.sw-pick svg{display:block}
.swatches input[type=color]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.cal-day{cursor:pointer}
.cal-day:hover{background:var(--field)}
.cal-day.out:hover{background:#f3f2ee}
.cal-day.today:hover{background:var(--sky)}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-sel{border-top:1px solid var(--line);padding:12px 14px}
.cal-sel-hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.cal-sel-hd b{font-size:14px}
.cal-chip{width:9px;height:9px;border-radius:50%;background:var(--ink);flex-shrink:0;margin-top:5px}
/* .iss-t / .iss-s are inline spans in the detail sheet; in the strip they
   need to stack, or the project name and its sub-line run together. */
.cal-sel .iss-t,.cal-sel .iss-s{display:block}
/* Project colour picker */
.swatches{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);cursor:pointer;padding:0;background:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1;font-weight:700;transition:transform .16s ease,box-shadow .2s ease}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.sw-none{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--field)}
.swatches input[type=color]{width:32px;height:24px;padding:0;border:1px solid var(--line-strong);border-radius:5px;background:none;cursor:pointer}
.t-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:1px}
@media(max-width:700px){.cal-day{min-height:56px}.cal-ev{font-size:9px;padding:2px 4px}.cal-ev-i{font-size:8px}}
.tl-year{display:flex;align-items:center;gap:12px;margin:22px 0 12px}
.tl-year span{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--muted)}
.tl-year hr{flex:1;border:none;border-top:1px solid var(--line)}
.tl-item{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tl-item:hover{background:var(--field)}
.tl-date{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.tl-title{font-weight:600;font-size:15px}
.tl-sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px}

.empty{border:1px dashed var(--line-strong);border-radius:8px;padding:42px 24px;text-align:center;background:var(--field)}
.empty h3{font-size:16px;font-weight:700;margin-bottom:6px}
.empty p{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.empty .btn{margin-top:16px}

/* Auth gate */
#authGate{position:fixed;inset:0;background:var(--field);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#authGate .sheet{max-width:420px}

/* Modal */
.veil{position:fixed;inset:0;background:rgba(20,23,25,.42);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto;z-index:40;animation:veilIn .3s cubic-bezier(.4,0,.2,1) both}
.sheet{background:var(--paper);border-radius:10px;width:100%;max-width:600px;box-shadow:0 24px 60px rgba(0,0,0,.22);animation:sheetIn .34s cubic-bezier(.22,.61,.36,1) both}
.sheet.wide{max-width:720px}
.veil.noanim,.veil.noanim .sheet{animation:none}
.veil.out{animation:veilOut .24s cubic-bezier(.4,0,1,1) both}
.veil.out .sheet{animation:sheetOut .24s cubic-bezier(.4,0,1,1) both}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
@keyframes veilOut{from{opacity:1}to{opacity:0}}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheetOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(10px) scale(.99)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheet-hd{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 0}
.sheet-hd h2{font-size:19px;font-weight:700}
.sheet-hd p{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.x{background:none;border:none;font-size:19px;line-height:1;color:var(--muted);cursor:pointer;margin-left:auto;padding:2px 4px}
.x:hover{color:var(--ink)}
.sheet-bd{padding:18px 22px}
.sheet-ft{display:flex;gap:9px;justify-content:flex-end;padding:6px 22px 22px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.f label b{color:var(--red);font-weight:400}
.f input,.f select,.f textarea{width:100%;background:var(--field)}
.f textarea{resize:vertical;min-height:72px;font-family:var(--sans);line-height:1.5}
.f .hint{font-family:var(--mono);font-size:11px;color:var(--muted)}
.check{display:flex;align-items:center;gap:9px;font-size:14px;margin-top:2px;cursor:pointer}
.check input{accent-color:var(--ink);width:15px;height:15px}
details.more{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
details.more summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
details.more summary::before{content:'▶ ';font-size:9px}
details.more[open] summary::before{content:'▼ '}
details.more .grid{margin-top:14px}

.det-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:16px}
.det-k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.det-v{font-size:14.5px;margin-top:3px}
.det-v.dim{color:var(--muted);font-style:italic}
.det-sec{margin-bottom:16px}
.det-sec h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.det-sec p{font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.iss-row{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin-bottom:6px}
.iss-d{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:80px;padding-top:2px}
.iss-b{flex:1;min-width:0}
.iss-t{font-size:14.5px;font-weight:600}
.iss-s{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.iss-n{font-size:13.5px;color:var(--muted);margin-top:3px}

/* ── Compiler workspace ── */
.ctx{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:8px;padding:12px 15px;margin-bottom:16px;flex-wrap:wrap}
.ctx-name{font-weight:700;font-size:16px}
.ctx-meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.panels .wide{grid-column:1/-1}
.pnl{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pnl-hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--field)}
.pnl-n{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:#fff;background:var(--ink);padding:3px 7px;border-radius:4px}
.pnl-t{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.pnl-opt{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto}
/* Collapsible panel — the fixture schedule is optional, so it starts closed */
.pnl-fold>summary{list-style:none;cursor:pointer;user-select:none}
.pnl-fold>summary::-webkit-details-marker{display:none}
.pnl-fold>summary::after{content:'\25B8';margin-left:2px;color:var(--muted);font-size:12px}
.pnl-fold[open]>summary::after{content:'\25BE'}
.pnl-fold:not([open])>summary{border-bottom:none}
.pnl-fold>summary:hover{background:#f2f1ec}
.pnl-opt{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnl-bd{padding:14px}
.pnl-note{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.7;margin-bottom:11px}

.dz{border:1px dashed var(--line-strong);border-radius:6px;padding:20px 14px;text-align:center;cursor:pointer;background:var(--field);transition:border-color .3s cubic-bezier(.4,0,.2,1),background .3s cubic-bezier(.4,0,.2,1),transform .2s ease}
.dz:hover,.dz.on{border-color:var(--ink);background:#fff}
.dz.on{transform:scale(1.012)}
.dz input{display:none}
.dz label{cursor:pointer;display:block}
.dz-cta{font-weight:600;font-size:14.5px}
.dz-hint{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px;display:block}

.fl{display:flex;flex-direction:column;gap:5px;margin-top:11px}
.fi{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--paper);transition:border-color .24s ease}
.fi:hover{border-color:var(--line-strong)}
.fi.in{animation:fiIn .34s cubic-bezier(.22,.61,.36,1) both}
.fi.out{animation:fiOut .26s cubic-bezier(.4,0,1,1) both}
@keyframes fiIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes fiOut{from{opacity:1}to{opacity:0;transform:translateX(14px)}}
.grip{cursor:grab;color:var(--line-strong);font-size:13px;flex-shrink:0}
.grip:hover{color:var(--ink)}
.fn{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 3px}
.fx:hover{color:var(--red)}
.ghost{opacity:.35;background:var(--field)}

/* Linked-folder bar */
.folderbar{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:6px;padding:9px 11px;margin-bottom:11px;background:var(--field)}
.fb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb-t{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fb-path{font-family:var(--mono);font-size:11.5px;color:var(--ink);word-break:break-all;margin-top:5px;line-height:1.55}
.fb-note{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}
.fb-note.warn{color:var(--sand-ink)}
.fb-note.err{color:var(--red)}
.fb-note.ok{color:var(--sage-ink)}

.delta{display:flex;flex-direction:column;gap:9px}
.delta-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.delta-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-width:92px;padding-top:4px}

.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px;opacity:0;transform:scaleX(.985);transform-origin:left;transition:opacity .35s cubic-bezier(.4,0,.2,1),transform .35s cubic-bezier(.4,0,.2,1)}
.track.on{opacity:1;transform:none}
.fill{height:100%;width:0;background:var(--ink);transition:width .45s cubic-bezier(.22,.61,.36,1)}
.stat-line{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:9px;min-height:16px}
.stat-line.ok{color:var(--sage-ink)}
.stat-line.err{color:var(--red)}
.act{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}
@keyframes sp{to{transform:rotate(360deg)}}
.sp{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}

.toast{position:fixed;left:50%;bottom:24px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:12.5px;padding:11px 18px;border-radius:6px;z-index:60;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(20,23,25,.28);animation:toastIn .36s cubic-bezier(.22,.61,.36,1) both}
.toast.out{animation:toastOut .3s cubic-bezier(.4,0,1,1) both}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(12px)}}

/* ── Motion ── */
#view{transition:opacity .26s cubic-bezier(.4,0,.2,1),transform .26s cubic-bezier(.4,0,.2,1)}
#view.leaving{opacity:0;transform:translateY(-7px)}
#view.entering{opacity:0;transform:translateY(11px);transition:none}

@keyframes rowIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#view.stagger .empty,
#view.stagger tbody tr,
#view.stagger .card,
#view.stagger .tl-item,
#view.stagger .tl-year,
#view.stagger .board>div,
#view.stagger .det-meta,
#view.stagger .det-sec{animation:rowIn .44s cubic-bezier(.22,.61,.36,1) both}
#view.stagger tbody tr:nth-child(1),#view.stagger .card:nth-child(1),#view.stagger .tl-item:nth-child(1),#view.stagger .board>div:nth-child(1),#view.stagger .det-sec:nth-child(1){animation-delay:.03s}
#view.stagger tbody tr:nth-child(2),#view.stagger .card:nth-child(2),#view.stagger .tl-item:nth-child(2),#view.stagger .board>div:nth-child(2),#view.stagger .det-sec:nth-child(2){animation-delay:.06s}
#view.stagger tbody tr:nth-child(3),#view.stagger .card:nth-child(3),#view.stagger .tl-item:nth-child(3),#view.stagger .board>div:nth-child(3),#view.stagger .det-sec:nth-child(3){animation-delay:.09s}
#view.stagger tbody tr:nth-child(4),#view.stagger .card:nth-child(4),#view.stagger .tl-item:nth-child(4),#view.stagger .board>div:nth-child(4),#view.stagger .det-sec:nth-child(4){animation-delay:.12s}
#view.stagger tbody tr:nth-child(5),#view.stagger .card:nth-child(5),#view.stagger .tl-item:nth-child(5),#view.stagger .det-sec:nth-child(5){animation-delay:.15s}
#view.stagger tbody tr:nth-child(6),#view.stagger .card:nth-child(6),#view.stagger .tl-item:nth-child(6),#view.stagger .det-sec:nth-child(6){animation-delay:.18s}
#view.stagger tbody tr:nth-child(7),#view.stagger .card:nth-child(7),#view.stagger .tl-item:nth-child(7){animation-delay:.21s}
#view.stagger tbody tr:nth-child(8),#view.stagger .card:nth-child(8),#view.stagger .tl-item:nth-child(8){animation-delay:.24s}
#view.stagger tbody tr:nth-child(9),#view.stagger .card:nth-child(9),#view.stagger .tl-item:nth-child(9){animation-delay:.27s}
#view.stagger tbody tr:nth-child(n+10),#view.stagger .card:nth-child(n+10),#view.stagger .tl-item:nth-child(n+10){animation-delay:.3s}

/* header text swap */
#secTitle,#secSub{transition:opacity .2s ease,transform .2s ease}
.head-out{opacity:0;transform:translateY(-4px)}

/* toolbar swap */
#toolbar.swap{animation:rowIn .38s cubic-bezier(.22,.61,.36,1) both}

/* compiler workspace entrance */
#compileRoot .ctx{animation:rowIn .42s cubic-bezier(.22,.61,.36,1) both}
#compileRoot .pnl{animation:rowIn .46s cubic-bezier(.22,.61,.36,1) both}
#compileRoot .pnl:nth-child(1){animation-delay:.05s}
#compileRoot .pnl:nth-child(2){animation-delay:.1s}
#compileRoot .pnl:nth-child(3){animation-delay:.15s}
#compileRoot .pnl:nth-child(4){animation-delay:.2s}
#compileRoot .act{animation:rowIn .46s cubic-bezier(.22,.61,.36,1) .26s both}
#deltaBox .delta,#deltaBox .pnl-note{animation:rowIn .34s cubic-bezier(.22,.61,.36,1) both}
.pill-count,.pill-sync{transition:background .3s ease,border-color .3s ease,color .3s ease}
.tag{transition:background .26s ease,border-color .26s ease,color .26s ease}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:900px){.panels{grid-template-columns:1fr}}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;overflow-x:auto;padding:14px 16px}
  .rail-foot,.mark-app{display:none}
  .mark-logo{max-width:118px}
  .mark-word{font-size:9.1px}
  .nav{flex-direction:row;gap:4px}.nav-label{display:none}.nav button{white-space:nowrap}.nav .make{margin-top:0}
  .grid{grid-template-columns:1fr}
  .tl-item{grid-template-columns:1fr;gap:4px}
}
</style>

<script>
(function(){
/* ═══════════ Storage ═══════════ */
const KEY='mazzetti:luminaire-registry:v1';
// Server mode (http/https) shares one registry via /api/registry for everyone
// on the deployed site, gated behind sign-in (see Auth below). Local mode is
// the fallback for when this file is opened straight from disk (file://),
// where records persist per-machine in localStorage instead of evaporating
// with the tab — that mode never talks to the network, so auth doesn't apply.
const hasServer=location.protocol==='http:'||location.protocol==='https:';
const hasLocal=(function(){try{localStorage.setItem(KEY+':probe','1');localStorage.removeItem(KEY+':probe');return true;}catch(e){return false;}})();
const STORE=hasServer?'server':hasLocal?'local':'none';
let reg={version:1,projects:[],issuances:[]}, storeOk=STORE!=='none';
let lastLoadedRevision=null;
let loadFailed=false;
let currentUser=null;
const whoAmI=()=>currentUser?(currentUser.name||currentUser.email):'';

const $=id=>document.getElementById(id);
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(r,id)=>r.querySelector('#'+id)?r.querySelector('#'+id).value.trim():'';

function adopt(raw){ if(!raw)return; try{const p=JSON.parse(raw); if(p&&Array.isArray(p.projects))reg=p;}catch(e){} }
async function load(){
  if(STORE==='server'){
    try{
      const res=await fetch('/api/registry');
      if(res.ok){ const d=await res.json(); if(d&&Array.isArray(d.projects))reg=d; lastLoadedRevision=(d&&d.revision)||null; storeOk=true; loadFailed=false; }
      else if(res.status===401||res.status===403){ checkSession(); }
      else { storeOk=false; loadFailed=true; }
    }catch(e){ storeOk=false; loadFailed=true; }
    return;
  }
  if(STORE==='local'){ try{adopt(localStorage.getItem(KEY));}catch(e){} return; }
  storeOk=false;
}
async function save(opts){ opts=opts||{}; reg.updatedAt=new Date().toISOString();
  if(STORE==='server'){
    try{
      const res=await fetch('/api/registry',{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({doc:{version:reg.version,projects:reg.projects,issuances:reg.issuances},expectedRevision:lastLoadedRevision})});
      if(res.status===409){ storeOk=false; renderRail(); if(!opts.silent)showConflict(); return false; }
      if(res.status===401||res.status===403){ storeOk=false; renderRail(); checkSession(); return false; }
      if(!res.ok){ storeOk=false; if(!opts.silent)toast('Save failed — export a backup before closing'); renderRail(); return false; }
      const body=await res.json(); reg.updatedAt=body.updatedAt; lastLoadedRevision=body.revision;
      storeOk=true; return true;
    }catch(e){ storeOk=false; if(!opts.silent)toast('Save failed — export a backup before closing'); renderRail(); return false; }
  }
  if(STORE==='local'){
    try{localStorage.setItem(KEY,JSON.stringify(reg));storeOk=true;return true;}
    catch(e){storeOk=false;if(!opts.silent)toast('Save failed (storage full?) — export a backup now');renderRail();return false;}
  }
  storeOk=false;renderRail();return false;
}
function showConflict(){
  modal('Someone else just saved changes','Reload to see the latest, then redo your edit',
    '<p class="det-v">Another save landed on the shared registry before yours did, so your change was not applied. Reload to pick up the latest version, then make your edit again.</p>',
    '<button class="btn btn-dark" id="go">Reload latest</button>');
  $('modalRoot').querySelector('#go').onclick=async()=>{ close(); await load(); render(true); };
}
function showNamePrompt(){
  modal('What’s your name?','Shown on records you add or edit — you can skip this',
    '<div class="f full"><label for="f_name_prompt">Your name</label><input id="f_name_prompt" type="text" placeholder="e.g. Jane Smith"></div>',
    '<button class="btn" id="skip">Skip</button><button class="btn btn-dark" id="go">Save</button>');
  const r=$('modalRoot');
  r.querySelector('#skip').onclick=close;
  r.querySelector('#go').onclick=async()=>{
    const v=r.querySelector('#f_name_prompt').value.trim();
    if(!v)return toast('Enter your name, or skip');
    try{
      const res=await fetch('/api/auth/set-name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v})});
      const d=await res.json();
      if(d.ok){ if(currentUser)currentUser.name=v; close(); render(true); }
      else toast(d.error||'Could not save name');
    }catch(e){ toast('Network error — try again'); }
  };
}

/* ═══════════ Auth ═══════════ */
async function checkSession(){
  if(STORE!=='server'){ $('app').hidden=false; return; }
  try{
    const r=await fetch('/api/auth/session');
    const s=await r.json();
    if(!s.authenticated){ renderAuthGate('request'); return; }
    if(s.status==='pending'){ renderAuthGate('pending',s); return; }
    if(s.status==='rejected'){ renderAuthGate('rejected',s); return; }
    currentUser=s;
    $('authGate').hidden=true; $('app').hidden=false;
    const nav=$('navAdmin'); if(nav)nav.hidden=!s.admin;
    await load(); render(true);
    if(s.needsName)showNamePrompt();
  }catch(e){
    renderAuthGate('request',{error:'Could not reach the server — try again'});
  }
}
async function doSignOut(){
  // Worth a warning: there's no password to sign back in with, so getting
  // back in means finding their sign-in link again (or asking an admin).
  if(!confirm('Sign out?\n\nYou’ll need your sign-in link to get back in — the one you bookmarked, or a new one from an admin.'))return;
  try{await fetch('/api/auth/logout',{method:'POST'});}catch(e){}
  location.reload();
}
function renderAuthGate(state,data){
  data=data||{};
  const g=$('authGate');
  $('app').hidden=true;
  let h='';
  if(state==='request'){
    h='<div class="sheet-hd"><div><h2>Request access to AutoPak</h2><p>Mazzetti studio access only — by invitation</p></div></div>'+
      '<div class="sheet-bd"><div class="f full"><label for="ag_email">Work email</label>'+
      '<input id="ag_email" type="email" placeholder="you@mazzetti.com" autocomplete="email"></div>'+
      '<p class="det-v dim">Already have a sign-in link? Open that link instead — you don’t need this form.</p>'+
      (data.error?'<p class="det-v" style="color:#b3492b">'+esc(data.error)+'</p>':'')+'</div>'+
      '<div class="sheet-ft"><button class="btn btn-dark" id="ag_go">Request access</button></div>';
  }else if(state==='sent'){
    h='<div class="sheet-hd"><div><h2>Request received</h2><p>An admin will send you a sign-in link</p></div></div>'+
      '<div class="sheet-bd"><p class="det-v">We’ve logged the request for <b>'+esc(data.email||'')+'</b>. An admin reviews these and sends a sign-in link directly — nothing is emailed automatically, so give them a nudge if it’s urgent.</p></div>'+
      '<div class="sheet-ft"><button class="btn btn-ghost" id="ag_back">Use a different email</button></div>';
  }else if(state==='pending'){
    h='<div class="sheet-hd"><div><h2>Waiting on approval</h2><p>An admin needs to let you in</p></div></div>'+
      '<div class="sheet-bd"><p class="det-v">Your request for <b>'+esc(data.email||'')+'</b> is waiting on admin review. An admin (btumba@mazzetti.com) approves access and sends a sign-in link directly.</p></div>'+
      '<div class="sheet-ft"><button class="btn" id="ag_refresh">Refresh</button><button class="btn btn-ghost" id="ag_signout">Sign out</button></div>';
  }else{
    h='<div class="sheet-hd"><div><h2>Access not approved</h2></div></div>'+
      '<div class="sheet-bd"><p class="det-v">Your request wasn’t approved. Contact btumba@mazzetti.com if this looks wrong.</p></div>'+
      '<div class="sheet-ft"><button class="btn btn-ghost" id="ag_signout">Sign out</button></div>';
  }
  g.innerHTML='<div class="sheet">'+h+'</div>';
  g.hidden=false;
  if(state==='request'){
    const email=$('ag_email');
    const submit=async()=>{
      const v=email.value.trim();
      if(!/^[^\s@]+@mazzetti\.com$/i.test(v)){ renderAuthGate('request',{error:'Use your @mazzetti.com email address'}); return; }
      const go=$('ag_go'); go.disabled=true; go.textContent='Sending…';
      try{
        const r=await fetch('/api/auth/request-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:v})});
        const d=await r.json();
        if(d.ok)renderAuthGate('sent',{email:v});
        else renderAuthGate('request',{error:d.error||'Something went wrong'});
      }catch(e){ renderAuthGate('request',{error:'Network error — try again'}); }
    };
    $('ag_go').onclick=submit;
    email.onkeydown=e=>{if(e.key==='Enter')submit();};
    email.focus();
  }else if(state==='sent'){
    $('ag_back').onclick=()=>renderAuthGate('request');
  }else if(state==='pending'){
    $('ag_refresh').onclick=checkSession;
    $('ag_signout').onclick=doSignOut;
  }else if(state==='rejected'){
    $('ag_signout').onclick=doSignOut;
  }
}

const issFor=id=>reg.issuances.filter(i=>i.projectId===id).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
function typesFor(id){const s=new Set();issFor(id).forEach(i=>(i.fixtureTags||[]).forEach(t=>t&&s.add(t)));return [...s].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));}
const projOf=id=>reg.projects.find(p=>p.id===id);
const STATUSES=['Active','On hold','Complete','Archived'];
const SECTORS=['Healthcare','Behavioral health','Lab / research','Education','Civic','Commercial','Residential','Other'];
const PHASES=['Concept','50% SD','100% SD','50% DD','100% DD','50% CD','100% CD','Permit','Bid','Addendum','Construction','Record set'];
/* Ten hues that stay legible with white type and sit alongside the studio
   palette. A project may also carry any custom colour; text contrast is
   computed from luminance either way, so a pale custom pick still reads. */
const PROJECT_COLORS=['#006595','#0f7a6c','#2f6f2f','#7a6a12','#b8860b','#8a6338','#b2432a','#7a1f5c','#5b4b8a','#4a5b6a'];
/* WCAG relative luminance, so the label flips to ink on a light colour. */
function textOn(hex){
  const h=String(hex||'').replace('#','');
  if(h.length!==6) return '#fff';
  const ch=i=>{const c=parseInt(h.slice(i,i+2),16)/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
  const L=0.2126*ch(0)+0.7152*ch(2)+0.0722*ch(4);
  return L>0.42?'#141719':'#fff';
}
const colorStyle=c=>c?' style="background:'+c+';color:'+textOn(c)+'"':'';
/* One control now covers both "issued for" and the stamped issuance
   description. Each option carries a readable label (what gets stamped, and
   what lands in the filename) and the short phase code the registry filters,
   sorts and reports on. "Custom…" frees the description from the list; when
   it's used there's no recognised phase, so the project's phase is left alone. */
const ISSUANCES=[
  ['Concept','Concept'],
  ['50% Schematic Design','50% SD'],
  ['100% Schematic Design','100% SD'],
  ['50% Design Development','50% DD'],
  ['100% Design Development','100% DD'],
  ['50% Construction Documents','50% CD'],
  ['100% Construction Documents','100% CD'],
  ['Permit Set','Permit'],
  ['Bid Set','Bid'],
  ['Addendum','Addendum'],
  ['Construction Administration','Construction'],
  ['Record Set','Record set'],
];
const CUSTOM='__custom';
const phaseOfLabel=l=>{const r=ISSUANCES.find(x=>x[0]===l);return r?r[1]:'';};
const labelOfPhase=p=>{const r=ISSUANCES.find(x=>x[1]===p);return r?r[0]:'';};
function issuanceControl(sid,cid,phase,desc){
  const known=desc&&ISSUANCES.some(x=>x[0]===desc);
  const isCustom=!!desc&&!known;
  const chosen=known?desc:(desc?'':labelOfPhase(phase));
  return '<select id="'+sid+'"><option value="">—</option>'+
    ISSUANCES.map(x=>'<option'+(!isCustom&&x[0]===chosen?' selected':'')+'>'+esc(x[0])+'</option>').join('')+
    '<option value="'+CUSTOM+'"'+(isCustom?' selected':'')+'>Custom…</option></select>'+
    '<input type="text" id="'+cid+'" placeholder="Type the issuance description" value="'+
      esc(isCustom?desc:'')+'"'+(isCustom?'':' style="display:none"')+'>';
}
/* Folder chosen in the project form but not yet attributable to a project id,
   because a new project has none until it is saved. Persisted in wireFolder's
   caller once the record exists. */
let pendingFolder=null;
function wireFolder(root,projectId){
  const btn=root.querySelector('#f_browse');
  if(!btn||!FS_OK) return;
  const field=root.querySelector('#f_folder'), note=root.querySelector('#f_folderNote');
  btn.onclick=async()=>{
    try{
      const h=await window.showDirectoryPicker({id:'mz-cutsheets',mode:'readwrite'});
      // A directory handle exposes only its leaf name — there is no API for the
      // absolute path — so an empty field gets "…\\name" as a breadcrumb and a
      // path the user typed themselves is left alone.
      if(!field.value.trim()) field.value='…\\'+h.name;
      if(projectId){ pendingFolder=null; const ok=await folderPut(projectId,h);
        if(note) note.textContent=ok?'Linked to “'+h.name+'”. The compiler will read it directly.'
                                   :'Picked “'+h.name+'”, but the browser would not store the link.';
      } else { pendingFolder=h;
        if(note) note.textContent='“'+h.name+'” will be linked when you save this project.';
      }
    }catch(e){ if(e&&e.name==='AbortError') return;
      if(note) note.textContent='Could not open that folder: '+(e&&e.message||e); }
  };
}
function wireColors(root){
  const hid=root.querySelector('#f_color'), wrap=root.querySelector('#f_colors');
  if(!hid||!wrap) return;
  // A ring alone reads too faintly at 22px, so the chosen preset also takes a
  // tick, in whichever of ink/white stays legible on that colour.
  const pickBtn=wrap.querySelector('#f_colorPick');
  const glyph=pickBtn?pickBtn.innerHTML:'';
  const mark=v=>{
    const val=v||'', isPreset=PROJECT_COLORS.indexOf(val)>=0;
    wrap.querySelectorAll('.sw').forEach(b=>{
      if(b.id==='f_colorPick') return;
      const c=b.dataset.color||'', on=c===val;
      b.classList.toggle('on',on);
      if(b.classList.contains('sw-none')) return;
      b.textContent = on ? '\u2713' : '';
      b.style.color = on ? textOn(c) : '';
    });
    if(!pickBtn) return;
    const custom=!!val&&!isPreset;
    pickBtn.classList.toggle('on',custom);
    pickBtn.style.background=custom?val:'';
    pickBtn.style.color=custom?textOn(val):'';
    pickBtn.innerHTML=custom?'\u2713':glyph;
  };
  wrap.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{hid.value=b.dataset.color||'';mark(hid.value);});
  const cust=root.querySelector('#f_colorCustom'), pick=root.querySelector('#f_colorPick');
  // The native colour well is kept off-screen; the round pick button opens it,
  // so the control reads like the swatches beside it rather than a form widget.
  if(pick&&cust) pick.onclick=()=>cust.click();
  if(cust) cust.oninput=()=>{hid.value=cust.value;mark(hid.value);};
}
function wireIssuance(root,sid,cid){
  const sel=root.querySelector('#'+sid), inp=root.querySelector('#'+cid);
  if(!sel||!inp) return;
  sel.onchange=()=>{ const c=sel.value===CUSTOM; inp.style.display=c?'':'none'; if(c)inp.focus(); };
}
function issuanceValues(root,sid,cid){
  const sel=root.querySelector('#'+sid);
  if(!sel) return {issuedFor:'',description:''};
  if(sel.value===CUSTOM){
    const inp=root.querySelector('#'+cid);
    return {issuedFor:'',description:(inp&&inp.value.trim())||''};
  }
  return {issuedFor:phaseOfLabel(sel.value),description:sel.value};
}

const RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const D=ms=>RM?0:ms;

function toast(m){
  const r=$('toastRoot');
  clearTimeout(r._t); clearTimeout(r._t2);
  const prev=r.firstElementChild;
  if(prev){prev.classList.add('out');setTimeout(()=>prev.remove(),D(300));}
  const el=document.createElement('div'); el.className='toast'; el.textContent=m;
  r.appendChild(el);
  r._t=setTimeout(()=>{el.classList.add('out');r._t2=setTimeout(()=>el.remove(),D(320));},3400);
}

/* ═══════════ Modal ═══════════ */
function close(){
  const root=$('modalRoot'), veil=root.firstElementChild;
  if(!veil){root.innerHTML='';return;}
  if(veil.classList.contains('out'))return;
  veil.classList.add('out');
  setTimeout(()=>{if(root.firstElementChild===veil)root.innerHTML='';},D(240));
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function ensureLibs(){

// Fixture tag = everything in the filename up to the first underscore.
// Spaces and dashes are kept, so both sensor variants and series qualifiers
// survive intact.
//   "S8-S SERIES_Finelite_HP6_Surface"  -> "S8-S SERIES"
//   "S1-S_HEW_Strip Light 75R-75S"      -> "S1-S"
//   "P1_Finelite_HP4_Circle_2FT DIA"    -> "P1"
//   "R1-S"                              -> "R1-S"
function fixtureTag(nameNoExt){
  if(!nameNoExt) return '';
  return String(nameNoExt).split('_')[0].replace(/\s+/g,' ').trim();
}

// A luminaire type looks like P1, R6, P4-S, S8-S, W1-S, X1, HR1B, and may
// carry one ALL-CAPS qualifier after a space — "S8-S SERIES". The qualifier is
// matched case-SENSITIVELY on purpose: that is what stops a space-separated
// filename like "P1 Finelite HP4.pdf" being read as the type "P1 Finelite",
// and keeps the binders, permit sets and control cutsheets that share the
// folder ("260722 Cutsheet Binder", "Lutron seeTouch Wall Stations QSWS2", …)
// out of the package.
const TAG_BASE_RE=/^[A-Z]{1,3}\d{1,3}[A-Z]?(?:\.\d{1,2})?(?:-[A-Z0-9,]{1,6})?$/i;
const TAG_QUAL_RE=/^[A-Z][A-Z0-9-]{1,11}$/;
function isFixtureTag(t){
  if(!t) return false;
  const parts=String(t).trim().split(' ');
  if(parts.length>2 || !TAG_BASE_RE.test(parts[0])) return false;
  return parts.length===1 || TAG_QUAL_RE.test(parts[1]);
}
const isFixtureFile=f=>isFixtureTag(fixtureTag(String(f.name||'').replace(/\.pdf$/i,'')));

function b64bytes(b64){const s=atob(b64),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}

const tw=(f,t,z)=>f.widthOfTextAtSize(t||'',z);
function drawL(p,t,x,y,f,z,c){if(t)p.drawText(t,{x,y,font:f,size:z,color:c});}
function drawR(p,t,rx,y,f,z,c){if(t)p.drawText(t,{x:rx-tw(f,t,z),y,font:f,size:z,color:c});}
function drawC(p,t,cx,y,f,z,c){if(t)p.drawText(t,{x:cx-tw(f,t,z)/2,y,font:f,size:z,color:c});}
function fitSize(t,f,max,maxW,min){let z=max;while(z>(min||4)&&tw(f,t,z)>maxW)z-=0.25;return z;}
function wrapText(t,f,z,maxW){
  const out=[];let line='';
  for(const w of String(t||'').split(/\s+/).filter(Boolean)){
    const test=line?line+' '+w:w;
    if(tw(f,test,z)>maxW&&line){out.push(line);line=w;} else line=test;
  }
  if(line)out.push(line);
  return out.length?out:[''];
}
/* 2026-07-31 -> 07.31.26 */
function shortDate(iso){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||'').trim());
  return m?m[2]+'.'+m[3]+'.'+m[1].slice(2):String(iso||'');
}
function headerIssuanceLine(desc,iso){
  return [String(desc||'').toUpperCase().trim(),shortDate(iso)].filter(Boolean).join(' / ');
}

function drawLockup(page,wm,fonts,left,base,size,black){
  drawL(page,SUBMARK,left,base,fonts.display,size,black);
  if(!wm)return;
  const w=WM_WIDTH*size, h=w*wm.height/wm.width;
  page.drawPage(wm,{x:left+WM_DX*size,y:base+WM_DY*size,width:w,height:h});
}

function drawHeader(page,fonts,wm,d,black){
  drawLockup(page,wm,fonts,HDR.logoX,HDR.logoBase,HDR.logoSize,black);

  page.drawRectangle({x:TYPE_BOX.x,y:TYPE_BOX.y,width:TYPE_BOX.w,height:TYPE_BOX.h,
                      borderColor:black,borderWidth:1});
  const tag=String(d.fixtureTag||'').trim();
  if(tag){
    const sp=tag.indexOf(' ');
    const base=sp<0?tag:tag.slice(0,sp), qual=sp<0?'':tag.slice(sp+1);
    const cx=TYPE_BOX.x+TYPE_BOX.w/2, inner=TYPE_BOX.w-14;
    if(qual){
      // "S8-S SERIES" stacks: the type stays large and the qualifier sits
      // under it at 55%. Setting the whole string inline would shrink it to
      // about 10 pt inside a 36 pt box, which reads as an afterthought.
      const s1=fitSize(base,fonts.display,HDR.tagSize,inner);
      const s2=fitSize(qual,fonts.display,s1*0.55,inner);
      const h1=CAP*s1, h2=CAP*s2, gap=3;
      const top=TYPE_BOX.y+(TYPE_BOX.h+h1+gap+h2)/2;
      drawC(page,base,cx,top-h1,fonts.display,s1,black);
      drawC(page,qual,cx,top-h1-gap-h2,fonts.display,s2,black);
    }else{
      const z=fitSize(tag,fonts.display,HDR.tagSize,inner);
      drawC(page,tag,cx,TYPE_BOX.y+(TYPE_BOX.h-CAP*z)/2,fonts.display,z,black);
    }
  }
  drawR(page,'LUMINAIRE TYPE',RULE_R,HDR.labelY,fonts.display,HDR.labelSize,black);

  // Centre block, kept clear of the logo on the left and the box on the right
  const leftEdge=HDR.logoX+tw(fonts.display,SUBMARK,HDR.logoSize)+14;
  const avail=Math.max(180,(TYPE_BOX.x-14)-leftEdge);
  const name=String(d.projectName||'').toUpperCase().trim();
  if(name)drawC(page,name,CX,HDR.nameY,fonts.display,fitSize(name,fonts.display,HDR.nameSize,avail),black);
  const iss=headerIssuanceLine(d.issuanceDescription,d.issuanceDateIso);
  if(iss)drawC(page,iss,CX,HDR.issY,fonts.display,fitSize(iss,fonts.display,HDR.issSize,avail),black);

  page.drawLine({start:{x:RULE_L,y:HDR_RULE_Y},end:{x:RULE_R,y:HDR_RULE_Y},thickness:RULE_W,color:black});
}

function drawFooter(page,fonts,d,black,grey){
  page.drawLine({start:{x:RULE_L,y:FOOT_RULE_Y},end:{x:RULE_R,y:FOOT_RULE_Y},thickness:RULE_W,color:black});
  // Two quiet items on one baseline, flushed to the outer edges of the placed
  // sheet: the studio's web address left, the page number right. The studio
  // name, street address and project location all live on the cover, so
  // repeating them on all 70 sheets was only noise.
  const fy=FOOT_RULE_Y-12;
  drawL(page,WEBSITE,CBOX.left,fy,fonts.text,FOOT_SIZE,grey);
  if(d.totalPages)
    drawR(page,'Page '+d.currentPage+' of '+d.totalPages,CBOX.right,fy,fonts.text,FOOT_SIZE,black);
}

function drawCoverPage(doc,PDFLibRef,fonts,wm,info){
  const {rgb,PageSizes}=PDFLibRef;
  const black=rgb(0,0,0);
  const page=doc.insertPage(0,PageSizes.Letter);
  const F=fonts.display;

  const name=String(info.projectName||'Untitled Project').toUpperCase();
  const nameSize=fitSize(name,F,CV.nameSize,CV.maxW,16);
  const nameLines=wrapText(name,F,nameSize,CV.maxW);

  const loc=String(info.projectLocation||'').toUpperCase().trim();
  const locSize=fitSize(loc,F,CV.locSize,CV.maxW,12);
  const locLines=loc?wrapText(loc,F,locSize,CV.maxW):[];

  const sub=String(info.projectSubtitle||'').toUpperCase().trim();
  const subSize=fitSize(sub,F,CV.subSize,CV.maxW,12);
  const subLines=sub?wrapText(sub,F,subSize,CV.maxW):[];

  // The reference sets a one-line name. Extra lines lift the block so it
  // stays optically centred above the logo instead of running into it.
  const extra=((nameLines.length-1)*nameSize+Math.max(0,locLines.length-1)*locSize
              +Math.max(0,subLines.length-1)*subSize)*1.25;
  let y=CV.nameY+extra/2;

  for(const ln of nameLines){drawC(page,ln,CX,y,F,nameSize,black);y-=nameSize*1.25;}
  y+=nameSize*1.25;

  // Project location sits directly under the name, set at subtitle weight so
  // it reads from across a desk.
  if(locLines.length){
    y-=CV.gapSub;
    for(const ln of locLines){drawC(page,ln,CX,y,F,locSize,black);y-=locSize*1.25;}
    y+=locSize*1.25;
  }

  if(subLines.length){
    y-=(locLines.length?CV.gapSub2:CV.gapSub);
    for(const ln of subLines){drawC(page,ln,CX,y,F,subSize,black);y-=subSize*1.25;}
    y+=subSize*1.25;
  }

  y-=CV.gapIss;
  if(info.issuanceDescription){
    const t=info.issuanceDescription.toUpperCase();
    drawC(page,t,CX,y,F,fitSize(t,F,CV.subSize,CV.maxW),black);
  }
  y-=CV.gapDate;
  if(info.issuanceDate){
    const t=info.issuanceDate.toUpperCase();
    drawC(page,t,CX,y,F,fitSize(t,F,CV.subSize,CV.maxW),black);
  }

  // The abbreviation is deliberately NOT set on the cover — it survives only
  // in the package filename.
  const studioLeft=CX-tw(F,SUBMARK,CV.logoSize)/2;
  drawLockup(page,wm,fonts,studioLeft,CV.logoBase,CV.logoSize,black);
  return page;
}

/* ═══════════ Linked cutsheets folder ═══════════
   A browser cannot open a path from a string — the folder has to be chosen
   through the OS picker at least once. What it CAN do is keep the resulting
   FileSystemDirectoryHandle, so that pick happens once per project and every
   later compile reads the folder directly. The handle lives in IndexedDB keyed
   by project id; the human-readable path stays on the project record.

   Chrome/Edge only (File System Access API). Where it's unavailable the panel
   quietly falls back to drag-and-drop. */
const FS_OK = typeof window.showDirectoryPicker === 'function';
const IDB_NAME='mazzetti:cutsheet-folders', IDB_STORE='handles';
// Any PDF whose name contains "schedule" is treated as the fixture schedule.
const SCHEDULE_RE=/schedule/i;
// Packages this tool wrote into the folder — current naming and the older
// LTLD/LTLS scheme. They must never be read back in as source material.
const OUTPUT_RE=/(^LTL[SD]-|[-\s]Luminaire Cutsheets(\s*\(\d+\))?\.pdf$)/i;

function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked'));
  });
}
async function idbTx(mode,fn){
  const db=await idbOpen();
  try{
    return await new Promise((res,rej)=>{
      const req=fn(db.transaction(IDB_STORE,mode).objectStore(IDB_STORE));
      req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error);
    });
  } finally { db.close(); }
}
const folderGet=id=>idbTx('readonly',st=>st.get(id)).catch(()=>null);
const folderPut=(id,h)=>idbTx('readwrite',st=>st.put(h,id)).then(()=>true).catch(()=>false);
const folderDel=id=>idbTx('readwrite',st=>st.delete(id)).then(()=>true).catch(()=>false);

/* ── Output naming ──
   "YYYYMMDD - Project Name - Issuance Description - Luminaire Cutsheets.pdf"
   Empty parts are dropped rather than leaving " -  - " gaps. */
function safePart(s){
  return String(s==null?'':s)
    .replace(/[\\/:*?"<>|]/g,'-')   // characters Windows won't accept in a name
    .replace(/\s+/g,' ')
    .replace(/\s*-\s*-\s*/g,' - ')
    .trim().replace(/[.\s]+$/,'');
}
function packageFileName(fileDate,projectName,issuanceDescription){
  const parts=[fileDate,safePart(projectName),safePart(issuanceDescription)].filter(Boolean);
  parts.push('Luminaire Cutsheets');
  return parts.join(' - ')+'.pdf';
}

/** Write the finished package into the linked folder. Never overwrites blindly. */
async function writeToFolder(bytes,name){
  if(!folderHandle) return {ok:false,reason:'no folder linked'};
  if(typeof folderHandle.getFileHandle!=='function') return {ok:false,reason:'folder writing unsupported'};
  const perm=await folderPerm(folderHandle,true);
  if(perm!=='granted') return {ok:false,reason:'the browser did not grant write access'};
  const exists=async n=>{ try{ await folderHandle.getFileHandle(n); return true; }catch(e){ return false; } };
  let target=name;
  try{
    if(await exists(target)){
      const keep=!confirm('“'+target+'” already exists in the Cutsheets folder.\n\n'+
                          'OK — overwrite it\nCancel — keep both, save this one as a numbered copy');
      if(keep){
        const base=target.replace(/\.pdf$/i,'');
        let n=2, candidate;
        do{ candidate=base+' ('+n+').pdf'; n++; } while(await exists(candidate) && n<100);
        target=candidate;
      }
    }
    const fh=await folderHandle.getFileHandle(target,{create:true});
    if(typeof fh.createWritable!=='function') return {ok:false,reason:'folder writing unsupported'};
    const w=await fh.createWritable();
    await w.write(bytes);
    await w.close();
    return {ok:true,name:target};
  }catch(e){
    return {ok:false,reason:(e&&e.message)||String(e)};
  }
}

/** 'granted' | 'prompt' | 'denied'. Only call with request=true from a click. */
async function folderPerm(h,request){
  if(!h) return 'denied';
  if(typeof h.queryPermission!=='function') return 'granted';   // stub / older impl
  // readwrite throughout: the compiled package is written back into this folder.
  const opts={mode:'readwrite'};
  let st=await h.queryPermission(opts);
  if(st!=='granted' && request && typeof h.requestPermission==='function') st=await h.requestPermission(opts);
  return st;
}

/** Every top-level PDF in the folder, split into schedule vs datasheets. */
async function readFolder(h){
  const pdfs=[];
  for await (const entry of h.values()){
    if(entry.kind!=='file' || !/\.pdf$/i.test(entry.name)) continue;
    pdfs.push(await entry.getFile());
  }
  const byName=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'});
  // Drop our own previous output first, before the schedule test — otherwise a
  // package whose issuance description mentions a schedule would be pulled in.
  const priorPackages=pdfs.filter(f=>OUTPUT_RE.test(f.name)).sort(byName);
  const source=pdfs.filter(f=>!OUTPUT_RE.test(f.name));
  const sched=source.filter(f=>SCHEDULE_RE.test(f.name)).sort(byName);
  const rest=source.filter(f=>!SCHEDULE_RE.test(f.name));
  // Only genuine fixture cutsheets. Binders, permit sets, comparison guides and
  // control-equipment cutsheets stay out — they're reported, never silently dropped.
  const sheets=rest.filter(isFixtureFile).sort(byName);
  const ignored=rest.filter(f=>!isFixtureFile(f)).sort(byName);
  return {schedule:sched.slice(0,1), extraSchedules:sched.slice(1),
          datasheets:sheets, ignored, priorPackages, total:pdfs.length};
}
const stagedTags=()=>[...new Set(datasheetFiles.map(f=>fixtureTag(f.name.replace(/\.pdf$/i,''))).filter(Boolean))];

async function linkFolder(p){
  try{
    const h=await window.showDirectoryPicker({id:'mz-cutsheets',mode:'readwrite'});
    folderHandle=h;
    const saved=await folderPut(p.id,h);
    renderFolderBar(p);
    if(!saved) fbNote('Linked for this session only — the browser wouldn’t store the folder.','warn');
    // Record the leaf name if the project has no path yet, as a breadcrumb.
    if(!p.cutsheetFolder){ p.cutsheetFolder='…\\'+h.name; await save(); }
    await pullFolder(p,{request:true});
  }catch(e){
    if(e && e.name==='AbortError') return;            // user closed the picker
    fbNote('Could not link that folder: '+(e&&e.message||e),'err');
  }
}

/** Load the linked folder into the staging lists. Returns true on success. */
async function pullFolder(p,{request=false,quiet=false}={}){
  if(!folderHandle) return false;
  try{
    const st=await folderPerm(folderHandle,request);
    if(st!=='granted'){
      fbNote(st==='denied'
        ? 'Access to the folder was denied. Relink it, or drag the PDFs in below.'
        : 'The browser needs permission again — click “Reload now” and allow it.','warn');
      return false;
    }
    const r=await readFolder(folderHandle);
    if(!r.total){ fbNote('No PDFs found in '+folderHandle.name+'.','warn'); return false; }
    if(!r.datasheets.length && !r.schedule.length){
      fbNote('Found '+r.total+' PDF'+(r.total===1?'':'s')+' in '+folderHandle.name+
             ', but none look like fixture cutsheets (a name has to start with a luminaire '+
             'type such as P1, R6 or S8-S). Drag the ones you want in below.','warn');
      return false;
    }
    datasheetFiles=r.datasheets; scheduleFiles=r.schedule; seenFiles.clear();
    renderFiles(); refreshDelta();
    const bits=[r.datasheets.length+' fixture cutsheet'+(r.datasheets.length===1?'':'s')];
    if(r.schedule.length) bits.push('schedule: '+r.schedule[0].name);
    let msg='Loaded '+bits.join(' · ')+'.';
    const skipped=r.ignored.concat(r.extraSchedules,r.priorPackages);
    if(skipped.length){
      msg+=' Skipped '+skipped.length+' other PDF'+(skipped.length===1?'':'s')+' in the folder.';
    }
    fbNote(msg,'ok');
    if(skipped.length){
      const el=$('fbNote');
      if(el){
        const d=document.createElement('details');
        d.style.marginTop='5px';
        d.innerHTML='<summary style="cursor:pointer">show skipped</summary>'+
          '<div style="margin-top:4px">'+skipped.map(f=>'· '+esc(f.name)).join('<br>')+'</div>';
        el.appendChild(d);
      }
    }
    if(!quiet) toast(msg);
    return true;
  }catch(e){
    fbNote('Could not read the folder: '+(e&&e.message||e)+'. It may have moved, or the drive isn’t mounted.','err');
    return false;
  }
}

async function initFolder(p){
  renderFolderBar(p);
  if(!FS_OK) return;
  folderHandle=await folderGet(p.id);

  // Silent pull only if permission already stands; otherwise wait for a click.
  const st=await folderPerm(folderHandle,false);
  if(st==='granted') await pullFolder(p,{quiet:true});
  else fbNote('Folder is linked. Generating (or “Reload now”) will ask the browser for access.','warn');
}

function dropZone(el,kind){
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('on');});
  el.addEventListener('dragleave',e=>{e.preventDefault();el.classList.remove('on');});
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('on');addFiles(e.dataTransfer.files,kind);});
}
function addFiles(list,kind){
  const files=Array.from(list).filter(f=>/\.pdf$/i.test(f.name));
  if(!files.length)return;
  if(kind==='s') scheduleFiles=files.slice(0,1);
  else{
    const have=new Set(datasheetFiles.map(f=>f.name));
    const added=files.filter(f=>!have.has(f.name));
    datasheetFiles.push(...added);
    datasheetFiles.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
    // Files you drop in yourself are always kept — you asked for them — but a
    // name that doesn't start with a luminaire type would stamp something odd.
    const odd=added.filter(f=>!isFixtureFile(f));
    if(odd.length) fbNote(odd.length+' added file'+(odd.length===1?'':'s')+
      ' won\u2019t stamp a proper luminaire type: '+odd.slice(0,3).map(f=>f.name).join(', ')+
      (odd.length>3?' …':'')+'. Rename or remove them.','warn');
  }
  renderFiles(); refreshDelta();
}

  }));

    (t?'<span class="tag '+(ok?'tag-sky':'tag-sand')+'" title="'+(ok?'Stamped luminaire type':'Doesn\u2019t look like a luminaire type \u2014 check the filename')+'">'+esc(t)+(ok?'':' ?')+'</span>':'')+
    '<button class="fx" data-rd="'+esc(f.name)+'">&times;</button></div>';}).join('');

function refreshDelta(){ const p=projOf(compileFor); if(!p)return; const prev=issFor(p.id)[0]; renderDelta(prev?(prev.fixtureTags||[]):[],prev); }
function renderDelta(prevTypes,prev){
  const box=$('deltaBox'); if(!box)return;
  const now=stagedTags();
  $('dCount').textContent=now.length?now.length+' types staged':'';
  if(!now.length){ box.innerHTML='<p class="pnl-note" style="margin:0">Add datasheets and this compares the package against the last issuance on record.</p>'; return; }

    '<p class="pnl-note" style="margin:0">First package for this project — nothing to compare against yet.</p></div>'; return; }
  const added=now.filter(t=>!prevTypes.includes(t)), dropped=prevTypes.filter(t=>!now.includes(t)), kept=now.filter(t=>prevTypes.includes(t));
  box.innerHTML='<div class="delta">'+
    '<div class="delta-row"><span class="delta-k">Since '+esc(prev.issuedFor||fmt(prev.date))+'</span><div class="tags">'+
      '<span class="tag tag-sage">'+kept.length+' unchanged</span>'+

      '<span class="tag'+(dropped.length?' tag-sand':'')+'">'+dropped.length+' dropped</span></div></div>'+
    (added.length?'<div class="delta-row"><span class="delta-k">New</span><div class="tags">'+added.map(t=>'<span class="tag tag-sky">'+esc(t)+'</span>').join('')+'</div></div>':'')+
    (dropped.length?'<div class="delta-row"><span class="delta-k">Dropped</span><div class="tags">'+dropped.map(t=>'<span class="tag tag-sand">'+esc(t)+'</span>').join('')+'</div></div>':'')+

function addBookmarks(doc,marks,PDFLibRef){
  if(!marks.length)return;
  const {PDFName,PDFHexString}=PDFLibRef, ctx=doc.context;
  const outRef=ctx.nextRef(), refs=marks.map(()=>ctx.nextRef());
  ctx.assign(outRef,ctx.obj({Type:'Outlines',Count:marks.length,First:refs[0],Last:refs[refs.length-1]}));
  marks.forEach((m,i)=>{
    const dest=ctx.obj([doc.getPage(m.pageIndex).ref,PDFName.of('Fit')]);
    ctx.assign(refs[i],ctx.obj(Object.assign({Title:PDFHexString.fromText(m.title),Parent:outRef,Dest:dest},
      i>0?{Prev:refs[i-1]}:{}, i<marks.length-1?{Next:refs[i+1]}:{})));
  });
  doc.catalog.set(PDFName.of('Outlines'),outRef);
  doc.catalog.set(PDFName.of('PageMode'),PDFName.of('UseOutlines'));
}

async function generate(preview){
  if(busy)return;
  // Pull the linked folder before any other await: requestPermission() needs the
  // click's user activation, which a long await would spend.
  if(folderHandle && (!$('cPull') || chk(document,'cPull'))){
    setStatus('Reading the linked folder…');
    const ok=await pullFolder(projOf(compileFor)||{},{request:true});
    if(!ok){ setStatus('Could not read the linked folder — see the note above the file list.','err'); return; }
  }
  if(!datasheetFiles.length)return setStatus('Add at least one datasheet PDF to continue.','err');
  setBusy(true,preview?'preview':'gen'); setStatus(preview?'Building preview…':'Reading files…');
  if(!preview){$('track').classList.add('on');$('fill').style.width='0%';}
  try{
    await ensureLibs();
    const L=window.PDFLib, {PDFDocument,StandardFonts,PDFName,PageSizes,rgb}=L;
    const projectName=val(document,'cName'), subtitle=val(document,'cSub'),
          abbr=val(document,'cAbbr'), loc=val(document,'cLoc'), raw=val(document,'cDate');
    const iss=issuanceValues(document,'cIssue','cIssueCustom');
    const issDesc=iss.description;
    let pretty='', fileDate='';
    if(raw){pretty=new Date(raw+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});fileDate=raw.replace(/-/g,'');}

    let total=0, done=0;
    if(!preview){
      if(scheduleFiles.length){const b=await readBuf(scheduleFiles[0]);total+=(await PDFDocument.load(b,{ignoreEncryption:true})).getPageCount();}
      const counts=await Promise.all(datasheetFiles.map(async f=>(await PDFDocument.load(await readBuf(f),{ignoreEncryption:true})).getPageCount()));
      total+=counts.reduce((a,b)=>a+b,0);
    }
    const out=await PDFDocument.create(), marks=[];
    // Archivo Black has to be embedded through fontkit; it is subset on save,
    // so a package carries only the glyphs it actually uses (~10 KB).
    out.registerFontkit(window.fontkit);
    const fonts={
      display:await out.embedFont(b64bytes(FONT_B64),{subset:true}),
      text:await out.embedFont(StandardFonts.Helvetica),
    };
    const [wordmark]=await out.embedPdf(b64bytes(WORDMARK_B64),[0]);
    const black=rgb(0,0,0), grey=rgb(0.42,0.42,0.44);
    const bump=(msg)=>{if(preview||!total)return;$('fill').style.width=Math.round(done/total*100)+'%';setStatus(msg+' ('+Math.round(done/total*100)+'%)');};

    if(!preview&&scheduleFiles.length){
      marks.push({title:'Fixture Schedule',pageIndex:out.getPageCount()});
      const sd=await PDFDocument.load(await readBuf(scheduleFiles[0]),{ignoreEncryption:true});
      const cp=await out.copyPages(sd,sd.getPageIndices());
      for(const pg of cp){out.addPage(pg);done++;bump('Adding schedule');await new Promise(r=>setTimeout(r,0));}
    }
    const files=preview?datasheetFiles.slice(0,1):datasheetFiles;
    for(const f of files){
      const noExt=f.name.replace(/\.pdf$/i,''), tag=fixtureTag(noExt);
      if(!preview)marks.push({title:noExt,pageIndex:out.getPageCount()});
      const src=await PDFDocument.load(await readBuf(f),{ignoreEncryption:true});
      const pages=src.getPages(), n=pages.length, use=preview?pages.slice(0,1):pages;
      // Embed a datasheet's pages in ONE pass. embedPage() per page runs a fresh
      // copier each time, so shared fonts and images get duplicated for every
      // page — that alone was inflating a 13 MB source set to a 130 MB package.
      const usableIdx=[], usable=[], boxes=[];
      use.forEach((op,j)=>{
        if(!op.node.has(PDFName.of('Contents'))) return;
        usableIdx.push(j); usable.push(op);
        // Pass each page's own box explicitly. Without it pdf-lib ignores a
        // non-zero MediaBox/CropBox origin and the sheet lands offset by the
        // origin — cropped cutsheets came out shifted. Matches how
        // compile_package.py measures the source.
        const b=op.getCropBox&&op.getCropBox().width>0?op.getCropBox():op.getMediaBox();
        boxes.push({left:b.x,bottom:b.y,right:b.x+b.width,top:b.y+b.height});
      });
      let embeds=null;
      try{ embeds=await out.embedPages(usable,boxes); }catch(e){ embeds=null; }
      const byIdx={}; if(embeds) usableIdx.forEach((j,k)=>{ byIdx[j]=embeds[k]; });
      for(let j=0;j<use.length;j++){
        bump('Stamping '+tag);
        const op=use[j];
        if(!op.node.has(PDFName.of('Contents'))){done++;continue;}
        let ep=byIdx[j];
        if(!ep){ try{ep=await out.embedPage(op);}catch(e){done++;continue;} }
        const ow=ep.width, oh=ep.height;
        const sc=Math.min(CBOX_W/ow,CBOX_H/oh), sw=ow*sc, sh=oh*sc;
        const np=out.addPage(PageSizes.Letter);
        np.drawPage(ep,{x:CBOX.left+(CBOX_W-sw)/2,y:CBOX.bottom+(CBOX_H-sh)/2,width:sw,height:sh});
        drawHeader(np,fonts,wordmark,{projectName,issuanceDescription:issDesc,
          issuanceDateIso:raw,fixtureTag:tag},black);
        drawFooter(np,fonts,{projectLocation:loc,currentPage:j+1,totalPages:n},black,grey);
        if(!preview){done++;await new Promise(r=>setTimeout(r,0));}
      }
    }
    if(!preview){
      // insertPage(0,…) pushes every existing page back one, so shift the
      // captured bookmark indices and put Cover at the front.
      drawCoverPage(out,L,fonts,wordmark,{projectName,projectSubtitle:subtitle,
        projectLocation:loc,projectAbbreviation:abbr,
        issuanceDate:pretty,issuanceDescription:issDesc});
      marks.forEach(m=>{m.pageIndex+=1;});
      marks.unshift({title:'Cover',pageIndex:0});
    }
    if(!preview&&marks.length)addBookmarks(out,marks,L);
    const bytes=await out.save();

    if(preview){
      const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      window.open(url,'_blank'); setTimeout(()=>URL.revokeObjectURL(url),1000);
      setStatus('Preview opened in a new tab.','ok'); return;
    }

    const hasSched=scheduleFiles.length>0;
    let fileName=packageFileName(fileDate,projectName,issDesc);
    const pages=out.getPageCount();

    // Save into the linked Cutsheets folder when we can; fall back to a download.
    let savedTo='', downloaded=false;
    const wantSave=folderHandle && (!$('cSaveHere') || chk(document,'cSaveHere'));
    if(wantSave){
      setStatus('Saving into the Cutsheets folder…');
      const w=await writeToFolder(bytes,fileName);
      if(w.ok){ savedTo=w.name; fileName=w.name; }
      else fbNote('Could not save into the folder ('+w.reason+') — downloading instead.','warn');
    }
    if(!savedTo || ($('cAlsoDl') && chk(document,'cAlsoDl'))){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      a.download=fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(a.href),100);
      downloaded=true;
    }
    setStatus(pages+' pages compiled — '+
      (savedTo?'saved to the Cutsheets folder as “'+esc(savedTo)+'”'+(downloaded?' and downloaded':'')
              :'downloaded as “'+esc(fileName)+'”')+'.','ok');
    if(fileName.length>120) fbNote('That filename is '+fileName.length+' characters. Combined with a deep '+
      'server path it can approach the Windows 260-character limit — consider a shorter issuance description.','warn');

    /* ── Write back to the record ── */
    const p=compileFor===STANDALONE?null:projOf(compileFor);
    if(p){
      if(projectName&&projectName!==p.name)p.name=projectName;
      if(subtitle!==p.subtitle)p.subtitle=subtitle;
      if(abbr&&abbr!==p.abbreviation)p.abbreviation=abbr;
      if(loc&&loc!==p.location)p.location=loc;
      const issuedFor=iss.issuedFor;
      if(chk(document,'cSync')&&issuedFor)p.phase=issuedFor;
      p.updatedAt=new Date().toISOString();
      if(chk(document,'cLog')){
        const newIss={id:uid('iss'),projectId:p.id,date:raw||new Date().toISOString().slice(0,10),
          issuedFor,revision:val(document,'cRev'),packageType:hasSched?'Schedule & datasheets':'Datasheets only',
          issuanceDescription:issDesc,
          fileName,pageCount:pages,datasheetCount:datasheetFiles.length,hasSchedule:hasSched,
          fixtureTags:stagedTags(),transmittedTo:val(document,'cTo'),notes:val(document,'cNotes'),
          recordedAt:new Date().toISOString(),loggedBy:whoAmI()};
        reg.issuances.push(newIss);
        let ok=await save({silent:true});
        if(!ok){ await load(); reg.issuances.push(newIss); ok=await save(); }
        renderRail();
        if(ok){
          refreshDelta();
          setStatus(pages+' pages compiled — '+
            (savedTo?'saved to the Cutsheets folder as “'+esc(savedTo)+'”':'downloaded as “'+esc(fileName)+'”')+
            ' — and logged to '+esc(p.abbreviation||p.name)+'.','ok');
          toast('Logged to '+(p.abbreviation||p.name));
        } else {
          toast('Package compiled and downloaded, but logging to the registry failed — log it manually.');
        }
      } else { await save(); renderRail(); }
    }
  }catch(err){
    console.error(err); setStatus('Error: '+esc(err.message||String(err)),'err');
  }finally{
    setBusy(false);
    if(!preview&&$('track')){const tr=$('track');setTimeout(()=>{tr.classList.remove('on');setTimeout(()=>{if(!tr.classList.contains('on'))$('fill').style.width='0%';},D(360));},D(500));}
  }
}

/* ═══════════ Views ═══════════ */
function visible(){
  return reg.projects.filter(p=>{
    if(fStatus!=='all'&&(p.status||'Active')!==fStatus)return false;
    if(fSector!=='all'&&(p.sector||'')!==fSector)return false;
    if(fPhase!=='all'&&(p.phase||'')!==fPhase)return false;
    if(!q)return true;
    return [p.name,p.subtitle,p.abbreviation,p.number,p.client,p.location,p.sector,p.lead,p.team,p.description,p.standards,p.notes].concat(typesFor(p.id)).join(' ').toLowerCase().includes(q.toLowerCase());
  }).sort((a,b)=>{
    if(!!b.priority!==!!a.priority)return b.priority?1:-1;
    const ai=issFor(a.id)[0],bi=issFor(b.id)[0], ad=ai?ai.date:'', bd=bi?bi.date:'';
    return ad!==bd?String(bd).localeCompare(String(ad)):a.name.localeCompare(b.name);
  });
}
const statusTag=s=>{const c=s==='Active'?'tag-sage':s==='On hold'?'tag-sand':s==='Complete'?'tag-sky':'';return '<span class="tag '+c+'">'+esc(s||'Active')+'</span>';};
const emptyState=(t,x,b)=>'<div class="empty"><h3>'+t+'</h3><p>'+x+'</p>'+(b?'<button class="btn btn-dark" id="emptyAdd">'+b+'</button>':'')+'</div>';
const projectsEmptyState=()=>(STORE==='server'&&loadFailed)?
  emptyState('Couldn’t load the shared registry','Check your connection and reload the page — this doesn’t necessarily mean the registry is empty.','Reload'):
  emptyState('No projects on record yet','Add a project, then compile its first package from the same screen.','+ Add project');

    list.map(p=>{const i=issFor(p.id),t=typesFor(p.id);return '<tr data-open="'+p.id+'">'+

    '<td><div class="t-name">'+esc(p.name)+'</div>'+(p.location?'<div class="t-dim">'+esc(p.location)+'</div>':'')+'</td>'+
    '<td class="t-dim">'+esc(p.client||'—')+'</td>'+
    '<td>'+(p.phase?'<span class="tag tag-sand">'+esc(p.phase)+'</span>':'<span class="t-dim">—</span>')+'</td>'+
    '<td>'+statusTag(p.status)+'</td><td class="t-dim">'+i.length+'</td>'+
    '<td class="t-dim">'+(i[0]?fmt(i[0].date):'—')+'</td><td class="t-dim">'+(t.length||'—')+'</td>'+
    '<td><button class="row-btn" data-compile="'+p.id+'">Compile</button></td></tr>';}).join('')+'</tbody></table>';
}
function boardView(){
  const list=visible();
  if(!reg.projects.length)return projectsEmptyState();
  return '<div class="board">'+STATUSES.map(s=>{
    const col=list.filter(p=>(p.status||'Active')===s);

        '<div class="card-name">'+esc(p.name)+'</div>'+
        '<div class="card-meta">'+esc([p.client,p.location].filter(Boolean).join(' · ')||'—')+'<br>'+i.length+' issuance'+(i.length===1?'':'s')+(i[0]?' · last '+fmt(i[0].date):'')+'</div>'+

      :'<p class="t-dim" style="font-family:var(--mono);font-size:11px;padding:4px 2px">Empty</p>')+'</div>';
  }).join('')+'</div>';
