/* Local-calendar ISO date. Deliberately NOT toISOString(), which converts to
   UTC and lands issuances on the wrong day for anyone west of Greenwich. */
const isoLocal=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let calMonth=null, calSel=null, calExpand=null;
const CAL_MAX=3;   // chips shown before a day collapses behind a "more" button

function calendarView(rows){
  const byDate=new Map();
  rows.forEach(i=>{const k=String(i.date||'').slice(0,10);if(!k)return;
    if(!byDate.has(k))byDate.set(k,[]);byDate.get(k).push(i);});
  if(!calMonth){
    // Open on the most recent issuance rather than today — a registry that has
    // been quiet for a month would otherwise greet you with an empty grid.
    const latest=rows.map(i=>String(i.date||'')).filter(Boolean).sort().pop();
    const base=latest?new Date(latest+'T00:00:00'):new Date();
    calMonth={y:base.getFullYear(),m:base.getMonth()};
  }
  const {y,m}=calMonth;
  const first=new Date(y,m,1);
  const start=new Date(y,m,1-first.getDay());
  const todayKey=isoLocal(new Date());
  const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  // Project over issuance, two lines rather than one dashed string: a cell is a
  // seventh of the grid, so "Benioff Tower 3 - Permit Set" on one line
  // truncates to about "Benioff Ch…" and tells you neither.
  const chips=list=>list.map(i=>{const p=projOf(i.projectId);
    const who=(p&&(p.name||p.abbreviation))||'Unassigned';
    const what=i.issuanceDescription||i.issuedFor||i.packageType||'Package';
    return '<span class="cal-ev" data-open="'+i.projectId+'"'+colorStyle(p&&p.color)+
      ' title="'+esc(who+' — '+what)+'">'+
      '<span class="cal-ev-p">'+esc(who)+'</span>'+
      '<span class="cal-ev-i">'+esc(what)+'</span></span>';
  }).join('');
  let cells='';
  for(let k=0;k<42;k++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+k);
    const key=isoLocal(d);
    const evs=byDate.get(key)||[];
    // Only in-month days that carry something, plus the selected one, take a
    // tab stop — 42 focusable cells would bury the rest of the page.
    const focusable=(evs.length&&d.getMonth()===m)||key===calSel;
    cells+='<div class="cal-day'+(d.getMonth()!==m?' out':'')+(key===todayKey?' today':'')+
      (key===calSel?' sel':'')+(key===calExpand?' expanded':'')+'" data-calday="'+key+'" role="button"'+
      (focusable?' tabindex="0"':'')+' aria-pressed="'+(key===calSel)+'">'+
      '<span class="cal-n">'+d.getDate()+'</span>'+
      chips(evs.slice(0,CAL_MAX))+
      // The button stays in the flow even while expanded — dropping it would
      // shrink the cell by its own height and skew the week the other way.
      (evs.length>CAL_MAX
        ? '<button class="cal-more" data-calmore="'+key+'"'+(key===calExpand?' tabindex="-1"':'')+'>+'+
          (evs.length-CAL_MAX)+' more issuance'+(evs.length-CAL_MAX===1?'':'s')+'</button>'
        : '')+
      // The first three stay in the flow so the row keeps its height; the
      // popover simply covers them with the complete list.
      (key===calExpand
        ? '<div class="cal-pop">'+chips(evs)+
          '<button class="cal-less" data-calless="'+key+'">Show less</button></div>'
        : '')+
      '</div>';
  }
  const inMonth=rows.filter(i=>String(i.date||'').slice(0,7)===y+'-'+String(m+1).padStart(2,'0')).length;
  return '<div class="cal"><div class="cal-hd">'+
    '<button class="btn btn-sm" data-cal="-1" aria-label="Previous month">‹</button>'+
    '<span class="cal-title">'+esc(first.toLocaleDateString('en-US',{month:'long',year:'numeric'}))+'</span>'+
    '<input type="date" class="cal-d" data-caldate aria-label="Jump to date" value="'+(calSel||isoLocal(first))+'">'+
    '<button class="btn btn-sm" data-cal="1" aria-label="Next month">›</button>'+
    '<button class="btn btn-sm" data-cal="0">Today</button>'+
    '<span class="spacer"></span>'+
    '<span class="pill-count">'+inMonth+' this month · '+rows.length+' total</span>'+
    '</div><div class="cal-grid">'+dow+cells+'</div>'+calDayStrip(byDate)+'</div>';
}

/* What sits under the grid once a day is picked. Reuses the issuance-row
   styling from the project detail sheet so the two read the same. */
function calDayStrip(byDate){
  if(!calSel) return '';
  const evs=byDate.get(calSel)||[];
  const d=new Date(calSel+'T00:00:00');
  const head=isNaN(d)?calSel:d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  return '<div class="cal-sel"><div class="cal-sel-hd"><b>'+esc(head)+'</b>'+
    '<span class="pill-count">'+evs.length+' issuance'+(evs.length===1?'':'s')+'</span>'+
    '<span class="spacer"></span>'+
    '<button class="btn btn-ghost btn-sm" data-calclear>Clear selection</button></div>'+
    (evs.length?evs.map(i=>{const p=projOf(i.projectId);
      return '<div class="iss-row" data-open="'+i.projectId+'" style="cursor:pointer">'+
        '<span class="cal-chip"'+((p&&p.color)?' style="background:'+p.color+'"':'')+'></span>'+
        '<span class="iss-b"><span class="iss-t">'+esc(p?p.name:'Unassigned')+'</span>'+
        '<span class="iss-s">'+[i.issuanceDescription||i.issuedFor||i.packageType||'Package',
          i.revision,i.fileName,i.pageCount?i.pageCount+' pp':''].filter(Boolean).map(esc).join(' · ')+
        '</span></span></div>';}).join('')
    :'<p class="pnl-note" style="margin:0">No issuances on this date.</p>')+'</div>';
}

function timelineView(){
  const ids=new Set(visible().filter(p=>p.onTimeline!==false).map(p=>p.id));
  const rows=reg.issuances.filter(i=>ids.has(i.projectId)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  if(!rows.length)return emptyState('Nothing on the timeline yet','Issuances appear here the moment a package is compiled or logged.');
  let out=calendarView(rows),year='';
  rows.forEach(i=>{const p=projOf(i.projectId), y=String(i.date||'').slice(0,4)||'—';
    if(y!==year){year=y;out+='<div class="tl-year"><span>'+esc(y)+'</span><hr></div>';}
    out+='<div class="tl-item" data-open="'+i.projectId+'"><div class="tl-date">'+fmt(i.date)+'</div><div>'+
      '<div class="tl-title">'+esc(p?p.name:'Unassigned')+' — '+esc(i.issuedFor||i.packageType||'Package')+'</div>'+
      '<div class="tl-sub">'+[i.fileName,i.pageCount?i.pageCount+' pp':'',(i.fixtureTags||[]).length?(i.fixtureTags||[]).length+' types':'',i.notes].filter(Boolean).map(esc).join(' · ')+'</div></div></div>';});
  return out;
}
function issuanceView(){
  let rows=reg.issuances.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  if(q){const s=q.toLowerCase();rows=rows.filter(i=>{const p=projOf(i.projectId);return [i.issuedFor,i.packageType,i.fileName,i.notes,i.transmittedTo,i.revision,p&&p.name,p&&p.abbreviation].concat(i.fixtureTags||[]).join(' ').toLowerCase().includes(s);});}
  if(!rows.length)return emptyState('No issuances logged','Compile a package from a project and it lands here automatically.');
  return '<table class="tbl"><thead><tr><th>Date</th><th>Project</th><th>Issued for</th><th>Package</th><th>File</th><th>Pages</th><th>Types</th><th>Source</th></tr></thead><tbody>'+
    rows.map(i=>{const p=projOf(i.projectId);return '<tr data-open="'+i.projectId+'">'+
    '<td class="t-abbr">'+fmt(i.date)+'</td>'+
    '<td><div class="t-name">'+esc(p?p.name:'Unassigned')+'</div>'+(p&&p.abbreviation?'<div class="t-dim">'+esc(p.abbreviation)+'</div>':'')+'</td>'+
    '<td>'+(i.issuedFor?'<span class="tag tag-sand">'+esc(i.issuedFor)+'</span>':'<span class="t-dim">—</span>')+(i.revision?' <span class="tag">'+esc(i.revision)+'</span>':'')+'</td>'+
    '<td class="t-dim">'+esc(i.packageType||(i.hasSchedule?'Schedule & datasheets':'Datasheets only'))+'</td>'+
    '<td class="t-dim">'+esc(i.fileName||'—')+'</td><td class="t-dim">'+(i.pageCount||'—')+'</td>'+
    '<td class="t-dim">'+((i.fixtureTags||[]).length||'—')+'</td>'+
    '<td>'+(i.manual?'<span class="tag">logged</span>':'<span class="tag tag-sage">compiled</span>')+'</td></tr>';}).join('')+'</tbody></table>';
}
function typesView(){
  const map=new Map();
  reg.issuances.forEach(i=>(i.fixtureTags||[]).forEach(t=>{if(!t)return;
    const e=map.get(t)||{projects:new Set(),last:'',count:0};
    e.projects.add(i.projectId);e.count++;if(String(i.date||'')>e.last)e.last=i.date||'';map.set(t,e);}));
  let rows=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));
  if(q)rows=rows.filter(([t])=>t.toLowerCase().includes(q.toLowerCase()));
  const c=$('tc');if(c)c.textContent=rows.length+' types';
  if(!rows.length)return emptyState('No luminaire types yet','Types come from the tags stamped on each compiled package.');
  return '<table class="tbl"><thead><tr><th>Type</th><th>Projects</th><th>Issuances</th><th>Last used</th><th>Appears on</th></tr></thead><tbody>'+
    rows.map(([t,e])=>'<tr><td class="t-abbr">'+esc(t)+'</td><td class="t-dim">'+e.projects.size+'</td><td class="t-dim">'+e.count+'</td><td class="t-dim">'+fmt(e.last)+'</td>'+
    '<td><div class="tags">'+[...e.projects].map(id=>{const p=projOf(id);return '<span class="tag">'+esc(p?(p.abbreviation||p.name):'—')+'</span>';}).join('')+'</div></td></tr>').join('')+'</tbody></table>';
}

/* ═══════════ Admin ═══════════ */
let adminPending=[], adminUsers=[], adminLoaded=false;
async function loadAdmin(){
  try{
    const [pr,ur]=await Promise.all([fetch('/api/admin/pending'),fetch('/api/admin/users')]);
    const p=await pr.json(), u=await ur.json();
    if(p&&p.ok)adminPending=p.users||[];
    if(u&&u.ok)adminUsers=u.users||[];
  }catch(e){}
  adminLoaded=true;
  if(section==='admin')renderView(false);
}
function showInviteLink(email,link){
  modal('Sign-in link for '+email,'Send this to them yourself — nothing is emailed automatically',
    '<div class="f full"><label for="inv_link">Their permanent sign-in link</label>'+
    '<input id="inv_link" type="text" readonly value="'+esc(link)+'"></div>'+
    '<p class="det-v dim">This link doesn’t expire and can be used as often as they like — tell them to bookmark it. '+
    'They stay signed in on each browser they use it on, and only need it again if they sign out or switch computers. '+
    'Approval is permanent: you won’t need to approve them a second time.</p>',
    '<button class="btn" data-close>Done</button><button class="btn btn-dark" id="inv_copy">Copy link</button>');
  const r=$('modalRoot');
  const inp=r.querySelector('#inv_link');
  inp.onclick=()=>inp.select();
  r.querySelector('#inv_copy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(link); toast('Link copied'); }
    catch(e){ inp.select(); toast('Press Ctrl+C to copy'); }
  };
}
async function inviteEmail(email){
  const r=await fetch('/api/admin/invite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
  const d=await r.json();
  if(!d.ok){ toast(d.error||'Could not create invite'); return false; }
  showInviteLink(d.email,d.link); loadAdmin(); return true;
}
function adminView(){
  if(!adminLoaded)return '<p class="det-v dim">Loading…</p>';
  const pendingRows=adminPending.length?adminPending.map(u=>'<tr><td>'+esc(u.email)+'</td><td class="t-dim">'+fmt(u.createdAt)+'</td>'+
    '<td><button class="btn btn-sm" data-approve="'+esc(u.email)+'">Approve &amp; get link</button> <button class="btn btn-sm btn-danger" data-reject="'+u.id+'">Reject</button></td></tr>').join('')
    :'<tr><td colspan="3" class="t-dim">No pending requests.</td></tr>';
  const userRows=adminUsers.length?adminUsers.map(u=>'<tr><td>'+esc(u.email)+'</td><td class="t-dim">'+esc(u.name||'—')+'</td>'+
    '<td><button class="btn btn-sm" data-relink="'+esc(u.email)+'">Replace link</button> '+
    '<button class="btn btn-sm" data-setadmin="'+u.id+'" data-makeadmin="'+(u.isAdmin?'0':'1')+'">'+(u.isAdmin?'Remove admin':'Make admin')+'</button></td></tr>').join('')
    :'<tr><td colspan="3" class="t-dim">No approved users.</td></tr>';
  return '<div class="det-sec"><h4>Invite someone</h4>'+
    '<div class="f full"><label for="inv_email">Their @mazzetti.com email</label>'+
    '<input id="inv_email" type="email" placeholder="someone@mazzetti.com"></div>'+
    '<button class="btn btn-dark btn-sm" id="inv_go">Create sign-in link</button></div>'+
    '<div class="det-sec"><h4>Pending requests ('+adminPending.length+')</h4>'+
    '<table class="tbl"><thead><tr><th>Email</th><th>Requested</th><th></th></tr></thead><tbody>'+pendingRows+'</tbody></table></div>'+
    '<div class="det-sec"><h4>Approved users ('+adminUsers.length+')</h4>'+
    '<table class="tbl"><thead><tr><th>Email</th><th>Name</th><th></th></tr></thead><tbody>'+userRows+'</tbody></table></div>';
}
function bindAdminView(host){
  const go=host.querySelector('#inv_go'), inv=host.querySelector('#inv_email');
  if(go&&inv){
    const submit=async()=>{
      const v=inv.value.trim();
      if(!/^[^\s@]+@mazzetti\.com$/i.test(v))return toast('Use an @mazzetti.com email address');
      go.disabled=true;
      const ok=await inviteEmail(v);
      if(ok)inv.value='';
      go.disabled=false;
    };
    go.onclick=submit;
    inv.onkeydown=e=>{if(e.key==='Enter')submit();};
  }
  host.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    await inviteEmail(b.dataset.approve);
  });
  host.querySelectorAll('[data-relink]').forEach(b=>b.onclick=async()=>{
    // Only needed if they lost their link or it leaked — issuing a new one
    // kills the old, so any bookmark they still have stops working.
    if(!confirm('Replace this person’s sign-in link?\n\nTheir existing link stops working, so only do this if they’ve lost it or it needs revoking. Any browser they’re already signed in on stays signed in.'))return;
    b.disabled=true;
    await inviteEmail(b.dataset.relink);
    b.disabled=false;
  });
  host.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Reject this request? They will not be able to request access again with this email.'))return;
    b.disabled=true;
    await fetch('/api/admin/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:b.dataset.reject})});
    toast('Rejected'); loadAdmin();
  });
  host.querySelectorAll('[data-setadmin]').forEach(b=>b.onclick=async()=>{
    const makeAdmin=b.dataset.makeadmin==='1';
    b.disabled=true;
    const r=await fetch('/api/admin/set-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:b.dataset.setadmin,admin:makeAdmin})});
    const d=await r.json();
    if(!d.ok){ toast(d.error||'Failed'); b.disabled=false; return; }
    toast(makeAdmin?'Promoted to admin':'Removed admin'); loadAdmin();
  });
}

/* ═══════════ Export ═══════════ */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(a.href),100);}
function exportJson(){dl(new Blob([JSON.stringify(reg,null,2)],{type:'application/json'}),'Mazzetti_Luminaire_Registry_'+new Date().toISOString().slice(0,10)+'.json');toast('Exported '+reg.projects.length+' projects');}
function exportCsv(){
  const Q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const head=['Date','Project','Subtitle','Abbreviation','Client','Location','Sector','Issued for','Issuance description','Revision','Package','File name','Pages','Datasheets','Luminaire types','Transmitted to','Source','Notes'];
  const rows=reg.issuances.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))).map(i=>{const p=projOf(i.projectId)||{};
    return [i.date,p.name,p.subtitle,p.abbreviation,p.client,p.location,p.sector,i.issuedFor,i.issuanceDescription,i.revision,i.packageType,i.fileName,i.pageCount,i.datasheetCount,(i.fixtureTags||[]).join(' | '),i.transmittedTo,i.manual?'logged':'compiled',i.notes].map(Q).join(',');});
  dl(new Blob([head.map(Q).join(',')+'\n'+rows.join('\n')],{type:'text/csv'}),'Mazzetti_Issuance_Log_'+new Date().toISOString().slice(0,10)+'.csv');
  toast('Exported '+rows.length+' issuances');
}
function importJson(file){
  const r=new FileReader();
  r.onload=async()=>{
    let d;try{d=JSON.parse(r.result);}catch(e){return toast('That file isn’t valid registry JSON');}
    if(!d||!Array.isArray(d.projects))return toast('That file isn’t a registry export');
    const merge=confirm('Merge into the current registry?\n\nOK = merge (keeps existing records)\nCancel = replace everything');
    if(merge){const hp=new Set(reg.projects.map(p=>p.id));d.projects.forEach(p=>{if(!hp.has(p.id))reg.projects.push(p);});
      const hi=new Set(reg.issuances.map(i=>i.id));(d.issuances||[]).forEach(i=>{if(!hi.has(i.id))reg.issuances.push(i);});}
    else reg={version:1,projects:d.projects,issuances:d.issuances||[]};
    await save(); render(true); toast('Imported '+d.projects.length+' projects');
  };
  r.readAsText(file);
}

/* ═══════════ Chrome ═══════════ */
const TITLES={
  projects:['AutoPak Luminaire Cutsheet Compiler','Mazzetti — project record & issuance history'],
  issuances:['Issuance log','Every package the studio has sent out, newest first'],
  types:['Luminaire type library','Which types have been specified, and where'],
  compile:['Compile a package','Stamped, merged and logged against the project record'],
  admin:['Admin','Invite people, approve requests, and manage admin access']
};
function renderRail(){
  const t=new Set();reg.issuances.forEach(i=>(i.fixtureTags||[]).forEach(x=>x&&t.add(x)));
  $('sProjects').textContent=reg.projects.length;
  $('sIssuances').textContent=reg.issuances.length;
  $('sTypes').textContent=t.size;
  const l=reg.issuances.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];
  $('sLast').textContent=l?fmtShort(l.date):'—';
  const who=$('whoami');
  if(currentUser){ who.hidden=false; $('whoamiName').textContent=currentUser.name||currentUser.email; }
  else who.hidden=true;
}
$('signOut').onclick=doSignOut;
let lastToolbarSection=null;
function renderToolbar(){
  const t=$('toolbar');
  if(!RM&&lastToolbarSection!==section){
    t.classList.remove('swap'); void t.offsetWidth; t.classList.add('swap');
    clearTimeout(t._s); t._s=setTimeout(()=>t.classList.remove('swap'),420);
  }
  lastToolbarSection=section;
  const sync='<span class="pill-sync'+(storeOk?'':' warn')+'"><i></i>'+(storeOk?'Synced':'Session only')+'</span>';
  if(section==='projects'){
    t.innerHTML='<div class="seg">'+['board','table','timeline'].map(v=>'<button data-v="'+v+'" aria-pressed="'+(view===v)+'">'+v+'</button>').join('')+'</div>'+
      '<select id="fs"><option value="all">All statuses</option>'+opts(STATUSES,fStatus==='all'?null:fStatus)+'</select>'+
      '<select id="fx"><option value="all">All sectors</option>'+opts(SECTORS,fSector==='all'?null:fSector)+'</select>'+
      '<select id="fp"><option value="all">All phases</option>'+opts(PHASES,fPhase==='all'?null:fPhase)+'</select>'+
      '<input type="search" id="q" placeholder="Search projects, clients, luminaire types…" value="'+esc(q)+'">'+
      '<span class="pill-count">'+visible().length+' of '+reg.projects.length+' projects</span>'+sync+
      '<button class="btn mono-btn" id="exp">↓ .json</button>'+
      '<button class="btn mono-btn" id="imp">↑ import</button>'+
      '<input type="file" id="impf" accept=".json,application/json" style="display:none">'+
      '<button class="btn" id="add">+ Project</button><button class="btn btn-dark" id="cmp">+ Package</button>';
    t.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
      if(view===b.dataset.v)return;
      view=b.dataset.v;
      t.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));
      refreshList(true);
    });
    $('fs').onchange=e=>{fStatus=e.target.value;refreshList(true);};
    $('fx').onchange=e=>{fSector=e.target.value;refreshList(true);};
    $('fp').onchange=e=>{fPhase=e.target.value;refreshList(true);};
    $('add').onclick=()=>addProject();
    $('cmp').onclick=pickProjectThenCompile;
    $('exp').onclick=exportJson;
    $('imp').onclick=()=>$('impf').click();
    $('impf').onchange=e=>{if(e.target.files[0])importJson(e.target.files[0]);e.target.value='';};
    $('q').oninput=e=>{q=e.target.value;refreshList(false);};
  }else if(section==='issuances'){
    t.innerHTML='<input type="search" id="q" placeholder="Search issuances, files, phases…" value="'+esc(q)+'">'+
      '<span class="pill-count">'+reg.issuances.length+' issuances</span>'+sync+
      '<button class="btn mono-btn" id="csv">↓ .csv</button>'+
      '<button class="btn" id="man">+ Log past issuance</button><button class="btn btn-dark" id="cmp">+ Package</button>';
    $('csv').onclick=exportCsv;
    $('man').onclick=()=>reg.projects.length?logIssuance(null):toast('Add a project first');
    $('cmp').onclick=pickProjectThenCompile;
    $('q').oninput=e=>{q=e.target.value;renderView(false);};
  }else if(section==='compile'){
    const p=projOf(compileFor);
    t.innerHTML='<span class="pill-count">'+esc(compileFor===STANDALONE?'Standalone — no project record'
      :(p?(p.abbreviation?p.abbreviation+' · ':'')+p.name:'No project'))+'</span>'+sync+
      '<span class="spacer"></span><button class="btn btn-sm" id="swap">Switch project</button>';
    $('swap').onclick=pickProjectThenCompile;
  }else if(section==='admin'){
    t.innerHTML='<span class="pill-count">'+adminPending.length+' pending</span>'+sync;
  }else{
    t.innerHTML='<input type="search" id="q" placeholder="Search luminaire types…" value="'+esc(q)+'"><span class="pill-count" id="tc"></span>'+sync;
    $('q').oninput=e=>{q=e.target.value;renderView(false);};
  }
}
function viewHtml(){
  return section==='projects' ? (view==='table'?tableView():view==='board'?boardView():timelineView())
    : section==='issuances' ? issuanceView()
    : section==='admin' ? adminView()
    : typesView();
}
function bindView(){
  const host=$('view');
  if(section==='admin')bindAdminView(host);
  host.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-compile]'))return;detail(el.dataset.open);});
  host.querySelectorAll('[data-compile]').forEach(b=>b.onclick=e=>{e.stopPropagation();openCompiler(b.dataset.compile);});
  const ea=host.querySelector('#emptyAdd'); if(ea)ea.onclick=(STORE==='server'&&loadFailed)?(()=>location.reload()):(()=>addProject());
  host.querySelectorAll('[data-cal]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const v=parseInt(b.dataset.cal,10);
    if(v===0){const n=new Date();calMonth={y:n.getFullYear(),m:n.getMonth()};}
    else{const d=new Date(calMonth.y,calMonth.m+v,1);calMonth={y:d.getFullYear(),m:d.getMonth()};}
    // Stepping away from a selected day drops the selection, so the date field
    // and the strip never describe a day that is off the grid.
    if(calSel){const c=new Date(calSel+'T00:00:00');
      if(c.getFullYear()!==calMonth.y||c.getMonth()!==calMonth.m) calSel=null;}
    calExpand=null;
    renderView(false);
  });
  host.querySelectorAll('[data-caldate]').forEach(inp=>inp.onchange=()=>{
    const v=inp.value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;      // cleared box: leave the grid alone
    const d=new Date(v+'T00:00:00');
    if(isNaN(d)) return;
    calMonth={y:d.getFullYear(),m:d.getMonth()};
    calSel=v;                                        // picking a date selects that day
    calExpand=null;
    renderView(false);
  });
  host.querySelectorAll('[data-calclear]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); calSel=null; renderView(false);
  });
  host.querySelectorAll('[data-calmore]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); calExpand=b.dataset.calmore; renderView(false);
  });
  host.querySelectorAll('[data-calless]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); calExpand=null; renderView(false);
  });
  host.querySelectorAll('[data-calday]').forEach(el=>{
    const pick=e=>{
      // A click on an issuance chip opens that project; the more/less buttons and
      // anything inside the popover belong to the popover, not to day selection.
      if(e.target.closest('[data-open],[data-calmore],[data-calless],.cal-pop')) return;
      const k=el.dataset.calday;
      calSel = calSel===k ? null : k;
      if(calSel){
        // Picking a spill-over day from a neighbouring month walks there too,
        // otherwise the selection would sit outside the visible grid.
        const d=new Date(k+'T00:00:00');
        if(d.getFullYear()!==calMonth.y||d.getMonth()!==calMonth.m)
          calMonth={y:d.getFullYear(),m:d.getMonth()};
      }
      renderView(false);
    };
    el.onclick=pick;
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e);}};
  });
}
let paintToken=0;
function paintView(animate){
  const host=$('view'), token=++paintToken;
  const put=()=>{
    if(token!==paintToken)return;
    host.innerHTML=viewHtml(); bindView();
    host.classList.remove('leaving');
    host.classList.toggle('stagger',!!animate&&!RM);
    if(!animate||RM)return;
    host.classList.add('entering');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(token===paintToken)host.classList.remove('entering'); }));
  };
  if(!animate||RM){host.classList.remove('leaving','entering');put();return;}
  host.classList.add('leaving');
  setTimeout(put,D(160));
}
function renderView(animate){
  if(section==='compile'){ if(!compileMounted||!$('compileRoot'))mountCompile(); return; }
  compileMounted=false;
  paintView(animate);
}
function refreshList(animate){
  renderView(animate);
  const c=$('toolbar').querySelector('.pill-count');
  if(c&&section==='projects')c.textContent=visible().length+' of '+reg.projects.length+' projects';
}
function setHead(a,b){
  const t=$('secTitle'), s=$('secSub');
  if(t.textContent===a&&s.textContent===b)return;
  if(RM){t.textContent=a;s.textContent=b;return;}
  t.classList.add('head-out'); s.classList.add('head-out');
  setTimeout(()=>{
    t.textContent=a; s.textContent=b;
    requestAnimationFrame(()=>{t.classList.remove('head-out');s.classList.remove('head-out');});
  },160);
}
function render(animate){
  const t=TITLES[section];
  setHead(t[0],t[1]);
  renderRail(); renderToolbar(); renderView(animate);
}

$('nav').querySelectorAll('button[data-sec]').forEach(b=>b.onclick=()=>{
  section=b.dataset.sec;q='';compileMounted=false;
  $('nav').querySelectorAll('button[data-sec]').forEach(x=>x.setAttribute('aria-current',x===b));
  render(true);
  if(section==='admin'){ adminLoaded=false; loadAdmin(); }
});
$('newPkg').onclick=pickProjectThenCompile;

if(STORE==='server')checkSession();
else{ $('app').hidden=false; load().then(()=>render(true)); }
})();
